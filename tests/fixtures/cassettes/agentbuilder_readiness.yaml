        (ServiceNow): list/count/show open cases -> Get User Cases; updates/latest
        activity -> Get Case Updates even with HRC ID; details/status of a specific
        HRC ID -> Get User Cases then Get Case Details (HRC ID is not SysId); comment/attachment
        -> Add Attachments/Comments; direct create/file/open-a-case requests -> Create
        Case (not IT/update/view).\n  - How-to that maps to an action topic (e.g.,
        \"how do I update X\" -> Update/Manage; \"how do I report a payroll issue\"
