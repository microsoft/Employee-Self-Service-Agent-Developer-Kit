name: MTK Toolkit CI

# Scoped to the ESS NextGen Migration Toolkit: only runs when the toolkit (or
# this workflow) changes, so unrelated PRs don't pay for it.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'tools/ess-nextgen-migration-toolkit/**'
      - '.github/workflows/mtk-toolkit-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tools/ess-nextgen-migration-toolkit/**'
      - '.github/workflows/mtk-toolkit-ci.yml'

permissions:
  contents: read

jobs:
  mtk-toolkit:
    name: MTK toolkit (lint, types, unit tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/ess-nextgen-migration-toolkit

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies (locked)
      run: uv sync --frozen

    - name: Ruff lint
      run: uv run ruff check .

    - name: Ruff format check
      run: uv run ruff format --check .

    - name: Mypy (strict)
      run: uv run mypy src

    - name: Unit tests
      run: uv run pytest
