name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 5 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Check for Python source files
      id: check_python
      run: |
        if find . -type f -name "*.py" -not -path "./.git/*" | grep -q .; then
          echo "has_python=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_python=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No Python files in this branch — skipping CodeQL Python analysis."
        fi

    - name: Initialize CodeQL
      if: steps.check_python.outputs.has_python == 'true'
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      if: steps.check_python.outputs.has_python == 'true'
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        category: "/language:${{ matrix.language }}"
