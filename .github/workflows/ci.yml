name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install ruff
      # Pinned for reproducibility: an unpinned install silently upgrades and a
      # Ruff release that broadens the default rule set would fail every PR. The
      # rule set itself is pinned in pyproject.toml ([tool.ruff.lint] select).
      run: pip install ruff==0.16.0

    - name: Discover Python source paths
      id: discover
      run: |
        candidates="solutions/ess-maker-skills/scripts solutions/ess-maker-skills/src/mcp"
        paths=""
        for d in $candidates; do
          if [ -d "$d" ] && find "$d" -type f -name "*.py" 2>/dev/null | grep -q .; then
            paths="$paths $d"
          fi
        done
        paths=$(echo "$paths" | xargs)
        echo "paths=$paths" >> "$GITHUB_OUTPUT"
        if [ -n "$paths" ]; then
          echo "has_python=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Linting Python in: $paths"
        else
          echo "has_python=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No Python files under $candidates - skipping lint and syntax check. (Expected on branches that don't yet include Python sources; the slice PRs #29/#30/#31 add them.)"
        fi

    - name: Lint with ruff
      if: steps.discover.outputs.has_python == 'true'
      env:
        PATHS: ${{ steps.discover.outputs.paths }}
      run: ruff check $PATHS --output-format=github

    - name: Check Python syntax
      if: steps.discover.outputs.has_python == 'true'
      env:
        PATHS: ${{ steps.discover.outputs.paths }}
      run: |
        python -m compileall -q $PATHS

  installer-scripts:
    name: Installer script smoke tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # pwsh is preinstalled on GitHub-hosted ubuntu runners. The harness only
    # parses and string-matches the setup scripts (no OS-specific execution),
    # so it runs cross-platform. Guards against the Windows PowerShell 5.1
    # parse crash by asserting the scripts stay ASCII-only. See PR #185.
    - name: Run installer smoke tests
      shell: pwsh
      run: ./setup/Install-EssAdk.Tests.ps1

  landing-page-config:
    name: Landing-page configuration
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: >-
        pip install
        -r requirements-dev.txt
        -r solutions/ess-maker-skills/src/mcp/agentconfig_landing_page/requirements.txt

    - name: Run AgentConfiguration tests
      run: >-
        python -m pytest
        tests/mcp/agentconfig
        tests/scripts/test_setup_preserves_title_id.py
        tests/scripts/test_validate_branding.py
        -q

    - name: Test ESS Maker Quick Actions
      working-directory: tools/ess-maker-profile/extension
      run: |
        node extension.test.js
        npm run validate

  flightcheck-tests:
    name: FlightCheck offline test suite
    runs-on: ubuntu-latest

    # Runs the whole FlightCheck pytest suite. Every test is offline: network
    # calls are mocked (responses / respx) or replayed from committed VCR
    # cassettes, and `live`-marked tests are skipped unless opted in with
    # --run-live. This job enforces the FlightCheck tests on every PR. It
    # includes the offline
    # URL hygiene gate (tests/flightcheck/test_url_hygiene.py), which asserts
    # fetchable report URLs use https. It does NOT verify a path is live (that
    # a learn.microsoft.com article still exists) — stale-path detection is a
    # separate, networked concern kept out of this deterministic job.
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install runtime and test dependencies
      # Runtime deps (msal/requests/PyYAML/defusedxml) are imported by the
      # check modules the tests exercise; test deps (pytest/responses/respx/
      # vcrpy) come from the [test] extra in pyproject.toml.
      run: |
        pip install -r solutions/ess-maker-skills/scripts/requirements.txt
        pip install -e .[test]

    - name: Run FlightCheck offline test suite
      run: python -m pytest tests/flightcheck -q
