kind: AdaptiveDialog
modelDescription: |-
  Use this topic when a MANAGER asks about the COST CENTER / cost center code / cost center name / cost center number of THEIR DIRECT REPORTS in Workday. ONLY for direct reports (people who report to the user) — NOT for self, manager, peers, spouse, sibling, or any non-direct-report.

  Triggers:
  - "What is the cost center of my direct reports?"
  - "Cost center of my reports / team"
  - "Show cost centers for my direct reports"
  - "Which cost center is each of my reports under?"
  - "Cost center and company for my team"
  - "Direct reports' cost center"

  Result data contains a list of direct reports with their company name and cost center.

  Invalid (do NOT trigger): questions about another person's cost center who isn't a direct report — manager, sister, peer. Self-cost-center questions belong to the WorkdayCostCenter topic.

  Output rules:
  - Output MUST be a nested list in markdown
  - Use ONLY data from {Topic.workdayResponseTable}
  - Do NOT return data if you don't have enough info

inputs:
  - kind: AutomaticTaskInput
    propertyName: EmployeeName
    description: Employee name whose cost center needs to be retrieved
    entity: PersonNamePrebuiltEntity
    shouldPromptUser: false
    inputSettings:
      repeatCount: 0
      defaultValue: =Blank()

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - Show me my team's cost center data?
      - What cost centers are assigned to my reports?
      - What are my team's cost centers?

  actions:
    - kind: BeginDialog
      id: 3VGa9O
      displayName: Check manager status
      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdayManagerCheck

    - kind: BeginDialog
      id: jJpz3n
      displayName: Read direct-report cost centers through the SOAP adapter
      input:
        binding:
          scenarioName: msdyn_WorkdayHCMRuntimeManagerDirectCostCenter
          requestParametersJson: |-
            =JSON({
              ManagerOrgId: Global.ESS_UserContext_ManagerOrganizationId,
              As_Of_Effective_Date: Text(Today(), "yyyy-MM-dd")
            }, JSONFormat.Compact)

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemReadSOAPExecution
      output:
        binding:
          connectorStatus: Topic.connectorStatus
          errorMessage: Topic.errorResponse
          failureReason: Topic.failureReason
          isSuccess: Topic.isSuccess
          responseJson: Topic.workdayResponse

    - kind: ConditionGroup
      id: checkManagerCostCenterSuccess
      conditions:
        - id: managerCostCenterFailed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SendActivity
              id: sendManagerCostCenterError
              activity: I encountered an error retrieving your team's cost center information. Please try again later or contact support.

            - kind: EndDialog
              id: endManagerCostCenterOnError

    - kind: ParseValue
      id: aXVFNu
      displayName: Parse value to a record
      variable: Topic.workdayResponseRecord
      valueType:
        kind: Record
        properties:
          CostCenterCode:
            type:
              kind: Table
              properties:
                Value: String

          CostCenterName:
            type:
              kind: Table
              properties:
                Value: String

          Name:
            type:
              kind: Table
              properties:
                Value: String

          WorkerID:
            type:
              kind: Table
              properties:
                Value: String

      value: =Topic.workdayResponse

    - kind: SetVariable
      id: setVariable_ztXmui
      displayName: Extract data to table
      variable: Topic.workdayResponseTable
      value: |-
        =ForAll(
            Sequence(CountRows(Topic.workdayResponseRecord.WorkerID)),
            With(
                {employeeName: Last(FirstN(Topic.workdayResponseRecord.Name, Value)).Value},
                {
                    Name: employeeName,
                    FirstName: First(Split(employeeName, " ")).Value,
                    LastName: Last(Split(employeeName, " ")).Value,
                    CostCenterCode: Last(FirstN(Topic.workdayResponseRecord.CostCenterCode, Value)).Value,
                    CostCenterName: Last(FirstN(Topic.workdayResponseRecord.CostCenterName, Value)).Value
                }
            )
        )

    - kind: ConditionGroup
      id: conditionGroup_eEjEWp
      conditions:
        - id: conditionItem_yv6Ggl
          condition: =!IsBlank(Topic.EmployeeName)
          displayName: Check if EmployeeName provided
          actions:
            - kind: SetVariable
              id: setVariable_njPUra
              displayName: Filter for the given EmployeeName
              variable: Topic.workdayResponseTable
              value: |-
                =With(
                    {requestedName: Lower(Trim(Topic.EmployeeName))},
                    Filter(
                        Topic.workdayResponseTable,
                        Lower(Trim(Name)) = requestedName Or
                        Lower(Trim(FirstName)) = requestedName Or
                        Lower(Trim(LastName)) = requestedName Or
                        Lower(Trim(Concatenate(FirstName, " ", LastName))) = requestedName Or
                        Lower(Trim(Concatenate(LastName, " ", FirstName))) = requestedName
                    )
                )

            - kind: ConditionGroup
              id: conditionGroup_tAWzhS
              conditions:
                - id: conditionItem_sV8WXF
                  condition: =IsEmpty(Topic.workdayResponseTable)
                  displayName: Check is filtered data empty
                  actions:
                    - kind: SendActivity
                      id: sendActivity_3owxH6
                      displayName: Respond with no matching direct report
                      activity: I couldn't find {Topic.EmployeeName} among the direct reports returned by Workday. Verify the employee name and try again.

                    - kind: SetVariable
                      id: setVariable_wd0UBE
                      displayName: Clear workday response
                      variable: Topic.workdayResponse
                      value: =""

                    - kind: EndDialog
                      id: HsUkV7

    - kind: SendActivity
      id: sendActivity_SBD1Zi
      activity: |-
        Here is your team's cost center information:
        {Topic.workdayResponseTable}

inputType:
  properties:
    EmployeeName:
      displayName: EmployeeName
      description: Employee name whose cost center needs to be retrieved
      type: String

outputType:
  properties:
    workdayResponseTable:
      displayName: workdayResponseTable
      type:
        kind: Table
        properties:
          CostCenterCode: String
          CostCenterName: String
          FirstName: String
          LastName: String
          Name: String