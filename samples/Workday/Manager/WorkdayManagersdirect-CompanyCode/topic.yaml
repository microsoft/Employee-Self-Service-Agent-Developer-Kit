kind: AdaptiveDialog
modelDescription: |-
  Use this topic when a MANAGER asks about the COMPANY CODE / company name / legal entity / employing entity of THEIR DIRECT REPORTS in Workday. ONLY for direct reports (people who report to the user) — NOT for self, manager, peers, spouse, sibling, or any non-direct-report.

  Triggers:
  - "What is the company code of my direct reports?"
  - "What's the company / legal entity for my reports?"
  - "Show the employing company of my team"
  - "Direct reports' company code"
  - "My reportees' company / legal entity"
  - "Which company is each of my reports employed by?"

  do NOT trigger for self-company-code questions belong to the WorkdayCompanyCode topic.

  Output rules:
  - Output MUST be a nested list in markdown
  - Use ONLY data from {Topic.workdayResponseTable}
inputs:
  - kind: AutomaticTaskInput
    propertyName: EmployeeName
    description: Employee name whose company code needs to be fetched
    entity: PersonNamePrebuiltEntity
    shouldPromptUser: false
    inputSettings:
      repeatCount: 0
      defaultValue: =Blank()

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - Show me my team’s Company codes? 
      - What are the company codes for my reports? 
      - What company codes are mapped to my team members?

  actions:
    - kind: BeginDialog
      id: dAhS4T
      displayName: Check manager status
      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdayManagerCheck

    - kind: BeginDialog
      id: Gt044B
      displayName: Read direct-report company codes through the SOAP adapter
      input:
        binding:
          scenarioName: msdyn_WorkdayHCMRuntimeManagerDirectCompanyCode
          requestParametersJson: |-
            =JSON({
              ManagerOrgId: Global.ESS_UserContext_ManagerOrganizationId,
              As_Of_Effective_Date: Text(Today(), "yyyy-MM-dd")
            }, JSONFormat.Compact)

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemReadSOAPExecution
      output:
        binding:
          connectorStatus: Topic.connectorStatus
          errorMessage: Topic.errorResponse
          failureReason: Topic.failureReason
          isSuccess: Topic.isSuccess
          responseJson: Topic.workdayResponse

    - kind: ConditionGroup
      id: checkManagerCompanyCodeSuccess
      conditions:
        - id: managerCompanyCodeFailed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SendActivity
              id: sendManagerCompanyCodeError
              activity: I encountered an error retrieving your team's company code information. Please try again later or contact support.

            - kind: EndDialog
              id: endManagerCompanyCodeOnError

    - kind: ParseValue
      id: aIxWzK
      displayName: Parse value to a table
      variable: Topic.WorkdayResponseRecord
      valueType:
        kind: Record
        properties:
          CompanyCode:
            type:
              kind: Table
              properties:
                Value: String

          CompanyName:
            type:
              kind: Table
              properties:
                Value: String

          FirstName:
            type:
              kind: Table
              properties:
                Value: String

          LastName:
            type:
              kind: Table
              properties:
                Value: String

          WorkerID:
            type:
              kind: Table
              properties:
                Value: String

      value: =Topic.workdayResponse

    - kind: SetVariable
      id: HC2h7w
      displayName: Merge all records in table
      variable: Topic.workdayResponseTable
      value: |-
        =ForAll(
            Sequence(CountRows(Topic.WorkdayResponseRecord.WorkerID)),
            {
                FirstName: Last(FirstN(Topic.WorkdayResponseRecord.FirstName, Value)).Value,
                LastName: Last(FirstN(Topic.WorkdayResponseRecord.LastName, Value)).Value,
                CompanyCode: Last(FirstN(Topic.WorkdayResponseRecord.CompanyCode, Value)).Value,
                CompanyName: Last(FirstN(Topic.WorkdayResponseRecord.CompanyName, Value)).Value
            }
        )

    - kind: ConditionGroup
      id: conditionGroup_yepfHF
      conditions:
        - id: conditionItem_86c1ij
          condition: =!IsBlank(Topic.EmployeeName)
          displayName: Check if EmployeeName provided
          actions:
            - kind: SetVariable
              id: setVariable_z1fKB1
              displayName: Filter for the given EmployeeName
              variable: Topic.workdayResponseTable
              value: |
                =With(
                    {requestedName: Lower(Trim(Topic.EmployeeName))},
                    Filter(
                        Topic.workdayResponseTable,
                        Lower(Trim(FirstName)) = requestedName Or
                        Lower(Trim(LastName)) = requestedName Or
                        Lower(Trim(Concatenate(FirstName, " ", LastName))) = requestedName Or
                        Lower(Trim(Concatenate(LastName, " ", FirstName))) = requestedName
                    )
                )

            - kind: ConditionGroup
              id: conditionGroup_BVYTlV
              conditions:
                - id: conditionItem_QmVzq2
                  condition: =IsEmpty(Topic.workdayResponseTable)
                  displayName: Check is filtered data empty
                  actions:
                    - kind: SendActivity
                      id: SN9frD
                      displayName: Respond with no matching direct report
                      activity: I couldn't find {Topic.EmployeeName} among the direct reports returned by Workday. Verify the employee name and try again.

                    - kind: SetVariable
                      id: setVariable_wd0UBE
                      displayName: Clear workday response
                      variable: Topic.workdayResponse
                      value: =""

                    - kind: EndDialog
                      id: xVALae

    - kind: SendActivity
      id: sendActivity_Yqhll9
      activity: |-
        Here is your team's company code information:
        {Topic.workdayResponseTable}

inputType:
  properties:
    EmployeeName:
      displayName: EmployeeName
      description: Employee name whose company code needs to be fetched
      type: String

outputType:
  properties:
    workdayResponseTable:
      displayName: workdayResponseTable
      type:
        kind: Table
        properties:
          CompanyCode: String
          CompanyName: String
          FirstName: String
          LastName: String