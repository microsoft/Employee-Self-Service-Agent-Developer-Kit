kind: AdaptiveDialog
modelDescription: |-
  Returns user's personal profile from Workday: identity, contact, and org info only.
   
  Fields: Name, Emp ID, DOB, Gender, Title, Organization, Manager, Location, Email, Phone, Home Address.

  DO NOT route here for: job level, grade, band, FTE, rehire date, exempt status, employment type, hire date
   
  For FULL PROFILE:
  Heading = ""Your employee profile""
  Intro = ""Here's what I found in Workday, an HR platform your company uses.""
  Sections: Personal information, Role and work.
   
  For TENURE/POSITION:
  Heading = ""Time in your position""
  Intro = ""You've been in your current role as a [Position] for [LengthOfService].""
  Sections: About your position
   
  Rules:
  - Large heading, sentence case, section divider below
  - Bold section headings, non-bold sub bullets
  - Address in one row, intro after heading
  - Only relevant fields unless full profile requested"
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - What is my profile?
      - Show my profile
      - What is my employee ID?
      - What is my job title?
      - What is my work email?
      - What is my manager's name?
      - Who is my manager?
      - What department am I in?
      - What is my organization?
      - What is my work phone number?
      - What is my home address?
      - What is my hire date?
      - When did I start working here?
      - What is my tenure?
      - How long have I been with the company?
      - What is my length of service?
      - Am I an active employee?
      - What is my employment status?
      - What is my date of birth?
      - What is my gender?
      - What is my location?
      - Where do I work?

  actions:
    - kind: BeginDialog
      id: dZAI4Y
      displayName: Read employee profile through the SOAP adapter
      input:
        binding:
          scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetUserProfile
          requestParametersJson: |-
            =JSON({
              Employee_ID: Global.ESS_UserContext_Employee_Id,
              As_Of_Effective_Date: Text(Today(), "yyyy-MM-dd")
            }, JSONFormat.Compact)

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemReadSOAPExecution
      output:
        binding:
          connectorStatus: Topic.connectorStatus
          errorMessage: Topic.errorResponse
          failureReason: Topic.failureReason
          isSuccess: Topic.isSuccess
          responseJson: Topic.workdayResponse

    - kind: ConditionGroup
      id: checkUserProfileSuccess
      conditions:
        - id: userProfileFailed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SendActivity
              id: sendUserProfileError
              activity: I encountered an error retrieving your employee profile. Please try again later or contact support.

            - kind: EndDialog
              id: endUserProfileOnError

    - kind: ParseValue
      id: fP9fKn
      displayName: Parse workdayResponse
      variable: Topic.parsedWorkdayResponse
      valueType:
        kind: Record
        properties:
          EmployeeID:
            type:
              kind: Table
              properties:
                Value: String
          Name:
            type:
              kind: Table
              properties:
                Value: String
          DOB:
            type:
              kind: Table
              properties:
                Value: String
          Gender:
            type:
              kind: Table
              properties:
                Value: String
          BusinessTitle:
            type:
              kind: Table
              properties:
                Value: String
          Organization:
            type:
              kind: Table
              properties:
                Value: String
          Manager:
            type:
              kind: Table
              properties:
                Value: String
          Location:
            type:
              kind: Table
              properties:
                Value: String
          HireDate:
            type:
              kind: Table
              properties:
                Value: String
          EmailInformation:
            type:
              kind: Table
              properties:
                Email_Address:
                  type:
                    kind: Table
                    properties:
                      Value: String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String
                            Type_Reference:
                              type:
                                kind: Table
                                properties:
                                  ID:
                                    type:
                                      kind: Table
                                      properties:
                                        "@type": String
                                        "#text": String

          AddressInformation:
            type:
              kind: Table
              properties:
                "@Formatted_Address": String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String
                            Type_Reference:
                              type:
                                kind: Table
                                properties:
                                  ID:
                                    type:
                                      kind: Table
                                      properties:
                                        "@type": String
                                        "#text": String

          PhoneInformation:
            type:
              kind: Table
              properties:
                "@Tenant_Formatted_Phone": String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String
                            Type_Reference:
                              type:
                                kind: Table
                                properties:
                                  ID:
                                    type:
                                      kind: Table
                                      properties:
                                        "@type": String
                                        "#text": String

          Status:
            type:
              kind: Table
              properties:
                Value: String
          ContinuousServiceDate:
            type:
              kind: Table
              properties:
                Value: String

      value: =Topic.workdayResponse

    - kind: SetVariable
      id: setWorkEmail
      variable: Topic.workEmail
      value: |-
        =With(
          {
            emailRecord: LookUp(
              Topic.parsedWorkdayResponse.EmailInformation As EmailRecord,
              With(
                {typeData: First(First(EmailRecord.Usage_Data).Type_Data)},
                IfError(
                  LookUp(
                    First(typeData.Type_Reference).ID,
                    '@type' = "Communication_Usage_Type_ID"
                  ).'#text',
                  ""
                ) = "WORK"
              )
            )
          },
          IfError(First(emailRecord.Email_Address).Value, "")
        )

    - kind: SetVariable
      id: setHomeEmail
      variable: Topic.homeEmail
      value: |-
        =With(
          {
            emailRecord: LookUp(
              Topic.parsedWorkdayResponse.EmailInformation As EmailRecord,
              With(
                {typeData: First(First(EmailRecord.Usage_Data).Type_Data)},
                IfError(
                  LookUp(
                    First(typeData.Type_Reference).ID,
                    '@type' = "Communication_Usage_Type_ID"
                  ).'#text',
                  ""
                ) = "HOME"
              )
            )
          },
          IfError(First(emailRecord.Email_Address).Value, "")
        )

    - kind: SetVariable
      id: setHomeAddress
      variable: Topic.homeAddress
      value: |-
        =With(
          {
            addressRecord: LookUp(
              Topic.parsedWorkdayResponse.AddressInformation As AddressRecord,
              With(
                {typeData: First(First(AddressRecord.Usage_Data).Type_Data)},
                IfError(
                  LookUp(
                    First(typeData.Type_Reference).ID,
                    '@type' = "Communication_Usage_Type_ID"
                  ).'#text',
                  ""
                ) = "HOME"
              )
            )
          },
          IfError(Substitute(Substitute(addressRecord.'@Formatted_Address', Char(10), ", "), Char(13), ""), "")
        )

    - kind: SetVariable
      id: setHomePhone
      variable: Topic.homePhone
      value: |-
        =With(
          {
            phoneRecord: LookUp(
              Topic.parsedWorkdayResponse.PhoneInformation As PhoneRecord,
              With(
                {typeData: First(First(PhoneRecord.Usage_Data).Type_Data)},
                IfError(
                  LookUp(
                    First(typeData.Type_Reference).ID,
                    '@type' = "Communication_Usage_Type_ID"
                  ).'#text',
                  ""
                ) = "HOME"
              )
            )
          },
          IfError(phoneRecord.'@Tenant_Formatted_Phone', "")
        )

    - kind: SetVariable
      id: setWorkPhone
      variable: Topic.workPhone
      value: |-
        =With(
          {
            phoneRecord: LookUp(
              Topic.parsedWorkdayResponse.PhoneInformation As PhoneRecord,
              With(
                {typeData: First(First(PhoneRecord.Usage_Data).Type_Data)},
                IfError(
                  LookUp(
                    First(typeData.Type_Reference).ID,
                    '@type' = "Communication_Usage_Type_ID"
                  ).'#text',
                  ""
                ) = "WORK"
              )
            )
          },
          IfError(phoneRecord.'@Tenant_Formatted_Phone', "")
        )

    - kind: SetVariable
      id: setVariable_ServiceDate
      displayName: Calculate service date values
      variable: Topic.serviceDateCalc
      value: =DateValue(First(Topic.parsedWorkdayResponse.ContinuousServiceDate).Value)

    - kind: SetVariable
      id: setVariable_Years
      displayName: Calculate years
      variable: Topic.yearsOfService
      value: =RoundDown(DateDiff(Topic.serviceDateCalc, Today(), TimeUnit.Months) / 12, 0)

    - kind: SetVariable
      id: setVariable_Months
      displayName: Calculate months
      variable: Topic.monthsOfService
      value: =Mod(DateDiff(Topic.serviceDateCalc, Today(), TimeUnit.Months), 12)

    - kind: SetVariable
      id: setVariable_Days
      displayName: Calculate days
      variable: Topic.daysOfService
      value: =DateDiff(DateAdd(Topic.serviceDateCalc, DateDiff(Topic.serviceDateCalc, Today(), TimeUnit.Months), TimeUnit.Months), Today(), TimeUnit.Days)

    - kind: SetVariable
      id: setVariable_LHTcFu
      displayName: Set finalized data
      variable: Topic.finalizedData
      value: |-
        ={
            EmployeeID: First(Topic.parsedWorkdayResponse.EmployeeID).Value,
            Name: First(Topic.parsedWorkdayResponse.Name).Value,
            DOB: First(Topic.parsedWorkdayResponse.DOB).Value,
            Gender: First(Topic.parsedWorkdayResponse.Gender).Value,
            BusinessTitle: First(Topic.parsedWorkdayResponse.BusinessTitle).Value,
            Organization: First(Topic.parsedWorkdayResponse.Organization).Value,
            Manager: First(Topic.parsedWorkdayResponse.Manager).Value,
            Location: First(Topic.parsedWorkdayResponse.Location).Value,
            HireDate: First(Topic.parsedWorkdayResponse.HireDate).Value,
            WorkEmail: Topic.workEmail,
            HomeAddress: Topic.homeAddress,
            HomeEmail: Topic.homeEmail,
            HomePhone: Topic.homePhone,
            WorkPhone: Topic.workPhone,
            Status: If(First(Topic.parsedWorkdayResponse.Status).Value = "1", "Active", "Inactive"),
            ContinuousServiceDate: First(Topic.parsedWorkdayResponse.ContinuousServiceDate).Value,
            LengthOfService: 
                If(Topic.yearsOfService > 0, Topic.yearsOfService & " year" & If(Topic.yearsOfService > 1, "s", "") & " ", "") &
                If(Topic.monthsOfService > 0, Topic.monthsOfService & " month" & If(Topic.monthsOfService > 1, "s", "") & " ", "") &
                Topic.daysOfService & " day" & If(Topic.daysOfService <> 1, "s", "")
        }

    - kind: SendActivity
      id: sendActivity_0SDSlB
      activity: |-
        Here is your employee profile:
        {Topic.finalizedData}

inputType: {}
outputType:
  properties:
    finalizedData:
      displayName: finalizedData
      type:
        kind: Record
        properties:
          EmployeeID: String
          Name: String
          DOB: String
          Gender: String
          BusinessTitle: String
          Organization: String
          Manager: String
          Location: String
          HireDate: String
          WorkEmail: String
          HomeAddress: String
          HomeEmail: String
          HomePhone: String
          WorkPhone: String
          Status: String
          ContinuousServiceDate: String
          LengthOfService: String
