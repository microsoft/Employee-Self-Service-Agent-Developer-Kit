kind: AdaptiveDialog
modelDescription: |-
  Use this topic when the user asks about THEIR OWN government-issued IDs / immigration documents / identity documents stored in Workday — Social Security Number (SSN), national ID, passport, driver's license, tax ID, PAN card, Aadhaar, National Insurance (NI) number, SIN, visa, work visa, work permit, work authorization, green card, permanent resident (PR) card, or related fields. Data belongs exclusively to the requesting user.

  Trigger on "my" government-ID queries: "What is my SSN / PAN / Aadhaar / NI number?", "What's my passport number?", "When does my visa / work permit expire?", "Show my driver's license on file", "What's my tax ID?", "What government IDs are on my Workday profile?", "What's my green card / PR status?".

  Do NOT trigger for general questions about ID applications, renewals, immigration law, or work authorization policy
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: BeginDialog
      id: 3bFDxH
      displayName: Read employee government IDs through the SOAP adapter
      input:
        binding:
          scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetGovernmentIds
          requestParametersJson: |-
            =JSON({
              Employee_ID: Global.ESS_UserContext_Employee_Id,
              As_Of_Effective_Date: Text(Today(), "yyyy-MM-dd")
            }, JSONFormat.Compact)

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemReadSOAPExecution
      output:
        binding:
          connectorStatus: Topic.connectorStatus
          errorMessage: Topic.errorResponse
          failureReason: Topic.failureReason
          isSuccess: Topic.isSuccess
          responseJson: Topic.workdayResponse

    - kind: ConditionGroup
      id: checkGovernmentIdsSuccess
      conditions:
        - id: governmentIdsFailed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SendActivity
              id: sendGovernmentIdsError
              activity: I encountered an error retrieving your government ID information. Please try again later or contact support.

            - kind: EndDialog
              id: endGovernmentIdsOnError

    - kind: ParseValue
      id: v0OBu2
      displayName: Parse workdayResponse into table
      variable: Topic.parsedWorkdayResponse
      valueType:
        kind: Record
        properties:
          GovernmentId:
            type:
              kind: Table
              properties:
                Country_Reference:
                  type:
                    kind: Table
                    properties:
                      "@Descriptor": String
                      ID:
                        type:
                          kind: Table
                          properties:
                            "@type": String
                            "#text": String

                Expiration_Date:
                  type:
                    kind: Table
                    properties:
                      Value: String

                ID:
                  type:
                    kind: Table
                    properties:
                      Value: String

                ID_Type_Reference:
                  type:
                    kind: Table
                    properties:
                      "@Descriptor": String
                      ID:
                        type:
                          kind: Table
                          properties:
                            "@type": String
                            "#text": String

                Issued_Date:
                  type:
                    kind: Table
                    properties:
                      Value: String

      value: =Topic.workdayResponse
      errorPolicy: DefaultBlank

    - kind: BeginDialog
      id: 6k3mYE
      displayName: Refresh country name reference data
      input:
        binding:
          IsTableEmpty: =IsBlank(Global.CountryNameLookupTable)
          ReferenceDataKey: ISO_3166-1_Alpha-2_Code

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemRefreshReferenceData

    - kind: BeginDialog
      id: Xoydcu
      displayName: Refresh government ID type data
      input:
        binding:
          IsTableEmpty: =IsBlank(Global.GovernmentIdTypeLookupTable)
          ReferenceDataKey: Government_ID_Type_ID

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemRefreshReferenceData

    - kind: SetVariable
      id: setVariable_ZYrAxQ
      displayName: Get values from reference tables
      variable: Topic.finalizedResponseTableData
      value: |-
        =ForAll(
            Topic.parsedWorkdayResponse.GovernmentId As GovernmentIdRecord,
            With(
                {
                    countryReference: First(GovernmentIdRecord.Country_Reference),
                    idTypeReference: First(GovernmentIdRecord.ID_Type_Reference),
                    rawId: IfError(First(GovernmentIdRecord.ID).Value, "")
                },
                With(
                    {
                        countryKey: IfError(
                            LookUp(
                                countryReference.ID,
                                '@type' = First(Global.CountryNameLookupTable).Reference_ID_Type
                            ).'#text',
                            ""
                        ),
                        idTypeKey: IfError(
                            LookUp(
                                idTypeReference.ID,
                                '@type' = First(Global.GovernmentIdTypeLookupTable).Reference_ID_Type
                            ).'#text',
                            ""
                        )
                    },
                    {
                        EmployeeName: Global.ESS_UserContext_Employee_Firstname & " " & Global.ESS_UserContext_Employee_Lastname,
                        CountryName: Coalesce(
                            LookUp(
                                Global.CountryNameLookupTable,
                                ID = countryKey
                            ).Referenced_Object_Descriptor,
                            IfError(countryReference.'@Descriptor', ""),
                            countryKey
                        ),
                        ExpirationDate: IfError(First(GovernmentIdRecord.Expiration_Date).Value, ""),
                        IDType: Coalesce(
                            LookUp(
                                Global.GovernmentIdTypeLookupTable,
                                ID = idTypeKey
                            ).Referenced_Object_Descriptor,
                            IfError(idTypeReference.'@Descriptor', ""),
                            idTypeKey
                        ),
                        IssuedDate: IfError(First(GovernmentIdRecord.Issued_Date).Value, ""),
                        ID: If(IsBlank(rawId), Blank(), If(Len(rawId) > 4, "****" & Right(rawId, 4), "****"))
                    }
                )
            )
        )

    - kind: ConditionGroup
      id: conditionGroup_PLj70M
      conditions:
        - id: conditionItem_TCBTE7
          condition: =IsBlank(Topic.parsedWorkdayResponse.GovernmentId)
          actions:
            - kind: SendActivity
              id: sendActivity_jPX7sn
              activity: There are no government IDs listed for you in the system. If this information should be included, you can update it directly in Workday or reach out to HR for assistance.

      elseActions:
        - kind: SendActivity
          id: sendActivity_uxFMLZ
          activity: |-
            Here is your government ID information:
            {Topic.finalizedResponseTableData}

inputType:
  properties:
    EmployeeName:
      displayName: EmployeeName
      description: The name of the employee whose data is being requested.
      type: String

outputType:
  properties:
    finalizedResponseTableData:
      displayName: finalizedResponseTableData
      type:
        kind: Table
        properties:
          CountryName: String
          EmployeeName: String
          ExpirationDate: String
          ID: String
          IDType: String
          IssuedDate: String