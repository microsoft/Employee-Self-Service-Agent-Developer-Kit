kind: AdaptiveDialog
modelDescription: |-
  Use this topic when the user asks to VIEW or READ THEIR OWN contact information stored in Workday — home/personal address, mailing address, alternate address, personal email, work email, personal phone, mobile/cell phone, primary phone, secondary phone, work phone, home phone, emergency contact, or any contact-profile field. "Home" and "Personal" are synonymous.

  Trigger on read-only queries about "my" contact info: "What is my address?", "Show my email on file", "What's my phone number in Workday?", "What contact info do I have?", "Show my mobile number", "What's my work email?", "Display my contact details".

  Data is retrieved from Workday and belongs exclusively to the requesting user.

  Do NOT trigger for:
  - Another person's contact info
inputs:
  - kind: AutomaticTaskInput
    propertyName: EmployeeName
    description: The name of the employee whose data will be fetched
    entity: PersonNamePrebuiltEntity
    shouldPromptUser: false
    inputSettings:
      repeatCount: 0
      defaultValue: =Blank()

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - Show my Contact details? 
      - What is my Work Phone? 
      - What is my Work Email? 
      - What is my Work Address? 
      - Show my Work Contact information? 
      - Show my Personal Phone number? 
      - What is my Home Phone number? 
      - Show my Home Email? 
      - Can you tell me what my Personal Email is ? 
      - Which Personal email is registered as primary? 
      - Show my Home address? 
      - Show my Personal Contact Information? 
      - Show [EmployeeName]'s contact info

  actions:
    - kind: BeginDialog
      id: Z6efSa
      displayName: Read employee contact information through the SOAP adapter
      input:
        binding:
          scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetHomeContactInformation
          requestParametersJson: |-
            =JSON({
              Employee_ID: Global.ESS_UserContext_Employee_Id,
              As_Of_Effective_Date: Text(Today(), "yyyy-MM-dd")
            }, JSONFormat.Compact)

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemReadSOAPExecution
      output:
        binding:
          connectorStatus: Topic.connectorStatus
          errorMessage: Topic.errorResponse
          failureReason: Topic.failureReason
          isSuccess: Topic.isSuccess
          responseJson: Topic.workdayResponse

    - kind: ConditionGroup
      id: checkContactInformationSuccess
      conditions:
        - id: contactInformationFailed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SendActivity
              id: sendContactInformationError
              activity: I encountered an error retrieving your contact information. Please try again later or contact support.

            - kind: EndDialog
              id: endContactInformationOnError

    - kind: ParseValue
      id: b90ZAp
      displayName: Parse Work Contact data
      variable: Topic.workContactData
      valueType:
        kind: Record
        properties:
          EmailInformation:
            type:
              kind: Table
              properties:
                Email_Address:
                  type:
                    kind: Table
                    properties:
                      Value: String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String

          PhoneInformation:
            type:
              kind: Table
              properties:
                "@Tenant_Formatted_Phone": String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String

      value: =Topic.workdayResponse

    - kind: ParseValue
      id: D15SKZ
      displayName: Parse Home Contact data
      variable: Topic.homeContactData
      valueType:
        kind: Record
        properties:
          HomeEmailInformation:
            type:
              kind: Table
              properties:
                Email_Address:
                  type:
                    kind: Table
                    properties:
                      Value: String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String

          HomeAddress:
            type:
              kind: Table
              properties:
                Value: String

          HomePhoneInformation:
            type:
              kind: Table
              properties:
                "@Tenant_Formatted_Phone": String

                Usage_Data:
                  type:
                    kind: Table
                    properties:
                      Type_Data:
                        type:
                          kind: Table
                          properties:
                            "@Primary": String

      value: =Topic.workdayResponse

    - kind: ParseValue
      id: 3IdZeI
      displayName: Parse Work Address
      variable: Topic.workAddress
      valueType:
        kind: Record
        properties:
          WorkAddress:
            type:
              kind: Table
              properties:
                Value: String

      value: =Topic.workdayResponse

    - kind: SetVariable
      id: setVariable_LXnWnT
      displayName: Set final data
      variable: Topic.finalizedContactInformation
      value: |-
        ={
            employeeName: Global.ESS_UserContext_Employee_Firstname & " " & Global.ESS_UserContext_Employee_Lastname,
            workPhoneNumbers: ForAll(Topic.workContactData.PhoneInformation As PhoneRecord, With({usageData: First(PhoneRecord.Usage_Data)}, With({typeData: First(usageData.Type_Data)}, {PhoneNumber: IfError(PhoneRecord.'@Tenant_Formatted_Phone', ""), IsPrimaryPhoneNumber: Lower(IfError(typeData.'@Primary', "")) = "true" || IfError(typeData.'@Primary', "") = "1"}))),
            workEmails: ForAll(Topic.workContactData.EmailInformation As EmailRecord, With({usageData: First(EmailRecord.Usage_Data)}, With({typeData: First(usageData.Type_Data)}, {EmailAddress: IfError(First(EmailRecord.Email_Address).Value, ""), IsPrimaryEmailAddress: IfError(typeData.'@Primary', "")}))),
            workAddress: First(Topic.workAddress.WorkAddress).Value,
            homePhoneNumbers: ForAll(Topic.homeContactData.HomePhoneInformation As PhoneRecord, With({usageData: First(PhoneRecord.Usage_Data)}, With({typeData: First(usageData.Type_Data)}, {PhoneNumber: IfError(PhoneRecord.'@Tenant_Formatted_Phone', ""), IsPrimaryPhoneNumber: Lower(IfError(typeData.'@Primary', "")) = "true" || IfError(typeData.'@Primary', "") = "1"}))),
            homeEmails: ForAll(Topic.homeContactData.HomeEmailInformation As EmailRecord, With({usageData: First(EmailRecord.Usage_Data)}, With({typeData: First(usageData.Type_Data)}, {EmailAddress: IfError(First(EmailRecord.Email_Address).Value, ""), IsPrimaryEmailAddress: IfError(typeData.'@Primary', "")}))),
            homeAddress: First(Topic.homeContactData.HomeAddress).Value
        }

    - kind: SendActivity
      id: sendActivity_Shc3jt
      activity: |-
        Here is your contact information:
        {Topic.finalizedContactInformation}

inputType:
  properties:
    EmployeeName:
      displayName: EmployeeName
      description: The name of the employee whose data will be fetched
      type: String

outputType:
  properties:
    finalizedContactInformation:
      displayName: finalizedContactInformation
      type:
        kind: Record
        properties:
          employeeName: String
          homeAddress: String
          homeEmails:
            type:
              kind: Table
              properties:
                EmailAddress: String
                IsPrimaryEmailAddress: String

          homePhoneNumbers:
            type:
              kind: Table
              properties:
                IsPrimaryPhoneNumber: Boolean
                PhoneNumber: String

          workAddress: String
          workEmails:
            type:
              kind: Table
              properties:
                EmailAddress: String
                IsPrimaryEmailAddress: String

          workPhoneNumbers:
            type:
              kind: Table
              properties:
                IsPrimaryPhoneNumber: Boolean
                PhoneNumber: String