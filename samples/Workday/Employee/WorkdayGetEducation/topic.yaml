kind: AdaptiveDialog
modelDescription: |-
  Use this topic when the user asks to VIEW or READ THEIR OWN education / academic history / schooling stored in Workday — degree (bachelor's, master's, MBA, PhD), diploma, certificate, school/university/college/institution, alma mater, major, field of study, minor, graduation year/date, GPA, academic qualifications, or credentials.

  Trigger on "my" education-related queries: "What's my education?", "Show my degree", "Where did I study?", "What university is on my profile?", "What's my major / field of study?", "Show my academic background / qualifications / credentials", "What schooling do I have on file?".

  Data is retrieved from Workday and belongs exclusively to the requesting user.

  Do NOT trigger for general questions about tuition reimbursement, learning programs, or training
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: BeginDialog
      id: B7ae9T
      displayName: Read employee education through the SOAP adapter
      input:
        binding:
          scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetEducation
          requestParametersJson: |-
            =JSON({
              Employee_ID: Global.ESS_UserContext_Employee_Id,
              As_Of_Effective_Date: Text(Today(), "yyyy-MM-dd")
            }, JSONFormat.Compact)

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemReadSOAPExecution
      output:
        binding:
          connectorStatus: Topic.connectorStatus
          errorMessage: Topic.errorResponse
          failureReason: Topic.failureReason
          isSuccess: Topic.isSuccess
          responseJson: Topic.workdayResponse

    - kind: ConditionGroup
      id: checkEducationSuccess
      conditions:
        - id: educationFailed
          condition: =Topic.isSuccess = false
          actions:
            - kind: SendActivity
              id: sendEducationError
              activity: I encountered an error retrieving your education information. Please try again later or contact support.

            - kind: EndDialog
              id: endEducationOnError

    - kind: ParseValue
      id: yJ0sSR
      displayName: Parse Workday response
      variable: Topic.parsedWorkdayResponse
      valueType:
        kind: Record
        properties:
          EducationData:
            type:
              kind: Table
              properties:
                Country_Reference:
                  type:
                    kind: Table
                    properties:
                      "@Descriptor": String
                      ID:
                        type:
                          kind: Table
                          properties:
                            "@type": String
                            "#text": String

                Degree_Reference:
                  type:
                    kind: Table
                    properties:
                      "@Descriptor": String
                      ID:
                        type:
                          kind: Table
                          properties:
                            "@type": String
                            "#text": String

                Field_Of_Study_Reference:
                  type:
                    kind: Table
                    properties:
                      "@Descriptor": String
                      ID:
                        type:
                          kind: Table
                          properties:
                            "@type": String
                            "#text": String

                First_Year_Attended:
                  type:
                    kind: Table
                    properties:
                      Value: String

                Last_Year_Attended:
                  type:
                    kind: Table
                    properties:
                      Value: String

                School_Name:
                  type:
                    kind: Table
                    properties:
                      Value: String

      value: =Topic.workdayResponse

    - kind: BeginDialog
      id: M8G7as
      displayName: Refresh country name reference data
      input:
        binding:
          IsTableEmpty: =IsBlank(Global.CountryNameLookupTable)
          ReferenceDataKey: ISO_3166-1_Alpha-2_Code

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemRefreshReferenceData

    - kind: BeginDialog
      id: iM5A5i
      displayName: Refresh degree reference data
      input:
        binding:
          IsTableEmpty: =IsBlank(Global.DegreeTypeLookupTable)
          ReferenceDataKey: Degree_ID

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemRefreshReferenceData

    - kind: BeginDialog
      id: zG3du7
      displayName: Refresh field of study reference data
      input:
        binding:
          IsTableEmpty: =IsBlank(Global.FieldOfStudyLookupTable)
          ReferenceDataKey: Field_Of_Study_ID

      dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemRefreshReferenceData

    - kind: SetVariable
      id: setVariable_nD5Gkb
      displayName: Set final result data
      variable: Topic.FinalizedEducationData
      value: |
        =Table(
            ForAll(
                Topic.parsedWorkdayResponse.EducationData As EducationRecord,
                With(
                    {
                        countryReference: First(EducationRecord.Country_Reference),
                        degreeReference: First(EducationRecord.Degree_Reference),
                        fieldOfStudyReference: First(EducationRecord.Field_Of_Study_Reference)
                    },
                    {
                        EmployeeName: Global.ESS_UserContext_Employee_Firstname & " " & Global.ESS_UserContext_Employee_Lastname,
                        Country: LookUp(
                            Global.CountryNameLookupTable,
                            ID = LookUp(
                                countryReference.ID,
                                '@type' = First(Global.CountryNameLookupTable).Reference_ID_Type
                            ).'#text'
                        ).Referenced_Object_Descriptor,
                        School: IfError(First(EducationRecord.School_Name).Value, ""),
                        Degree: LookUp(
                            Global.DegreeTypeLookupTable,
                            ID = LookUp(
                                degreeReference.ID,
                                '@type' = First(Global.DegreeTypeLookupTable).Reference_ID_Type
                            ).'#text'
                        ).Referenced_Object_Descriptor,
                        FieldOfStudy: LookUp(
                            Global.FieldOfStudyLookupTable,
                            ID = LookUp(
                                fieldOfStudyReference.ID,
                                '@type' = First(Global.FieldOfStudyLookupTable).Reference_ID_Type
                            ).'#text'
                        ).Referenced_Object_Descriptor,
                        FirstYearAttended: IfError(First(EducationRecord.First_Year_Attended).Value, ""),
                        LastYearAttended: IfError(First(EducationRecord.Last_Year_Attended).Value, "")
                    }
                )
            )
        )

    - kind: ConditionGroup
      id: conditionGroup_PLj70M
      conditions:
        - id: conditionItem_TCBTE7
          condition: =IsBlank(Topic.parsedWorkdayResponse.EducationData)
          actions:
            - kind: SendActivity
              id: sendActivity_jPX7sn
              activity: There is no education information listed for you in the system. If this information should be included, you can update it directly in Workday or reach out to HR for assistance.

      elseActions:
        - kind: SendActivity
          id: sendActivity_educationResponse
          activity: |-
            Here is your education information:
            {Topic.FinalizedEducationData}

inputType:
  properties:
    EmployeeName:
      displayName: EmployeeName
      description: The name of the person whose employment data is being requested.
      type: String

outputType:
  properties:
    FinalizedEducationData:
      displayName: FinalizedEducationData
      type:
        kind: Table
        properties:
          Value:
            type:
              kind: Table
              properties:
                Country: String
                Degree: String
                EmployeeName: String
                FieldOfStudy: String
                FirstYearAttended: String
                LastYearAttended: String
                School: String