[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-inventory-discovery"
version = "0.1.0"
description = "ESS ADK discovery skill: admin-run crawler that writes tenant agent resources to the WeveNova Inventory API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# httpx is only needed by HttpInventoryClient; unit tests use the in-memory fakes and
# do not require it. It is declared so the real client works out of the box.
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_inventory_discovery"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
