      modifiedBy: b43923a9-9f93-482f-939e-6461def6d786

    displayName: "Workday Update PhoneNumber"
    id: 8276e3fd-f2c9-4cd7-88fb-5804916490c4
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfservicehr.topic.EmployeeUpdatePhoneNumber
    dialog:
      useVerbatimOutputMessages: true
      inputs:
        - kind: AutomaticTaskInput
          propertyName: ToPhoneNumber
          description: The new phone number to be updated to
          entity: PhoneNumberPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0
            defaultValue: =Blank()

        - kind: AutomaticTaskInput
          propertyName: FromPhoneNumber
          name: ExistingPhoneNumber
          description: The existing phone number to be updated
          entity: PhoneNumberPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0
            defaultValue: =Blank()

      modelDescription: |-
        This tool updates the phone number of the user making the request
        through Workday. ALWAYS invoke this tool when the user expresses
        intent to update, change, add, remove, or modify their phone number,
        mobile number, or contact number, even if they do not provide a
        specific phone number. The tool will prompt the user for any missing
        information through an interactive form.

        When to invoke:
        - "Update my phone number"
        - "I want to update my phone number"
        - "I want to change my phone number"
        - "Update my mobile number"
        - "I need to add a new phone number"
        - "Change my contact number"
        - Any variation of requesting a phone number update for themselves

        Do NOT invoke for:
        - Requests about other people's phone numbers
        - General questions about phone/contact policies
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - "Update my phone number in Workday."
        actions:
          - kind: ConditionGroup
            id: ensureWorkdayContext
            conditions:
              - id: ensureWorkdayContextWhenMissing
                condition: =IsBlank(Global.ESS_UserContext_Employee_Id) || Global.ESS_UserContext_Employee_Id = """"""
                displayName: Initialize Workday user context when needed
                actions:
                  - kind: BeginDialog
                    id: callWorkdayUserContext
                    displayName: Retrieve the current Workday user context
                    dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemGetUserContextV2

          - kind: SetVariable
            id: setVariable_flezsQ
            displayName: Set retry count variable
