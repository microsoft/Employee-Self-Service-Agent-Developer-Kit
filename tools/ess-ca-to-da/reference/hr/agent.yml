    displayName: ServiceNow HRSD Get User Cases
    id: e67a775e-db55-47e0-8404-07357ee7d4bb
    parentBotId: 00000000-0000-0000-0000-000000000000
    description: ServiceNow HRSD Get User Cases
    shareContext: {}
    state: Active
    status: Active
    schemaName: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDGetUserCases
    dialog:
      inputs:
        - kind: AutomaticTaskInput
          propertyName: IsActive
          description: |-
            This variable indicates the state of the cases the user wants to fetch. It is a boolean value that defaults to true unless specified otherwise.
            For active, open, or new cases, "IsActive" will be true; for resolved cases also "IsActive" will be true, and for closed cases, "IsActive" will be false.
          entity: BooleanPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0

      modelDescription: |-
        Purpose: Fetch and list the user's HR cases from ServiceNow.
        **State Logic:**
        - `IsActive=true`: Open/Active/In Progress (default)
        - `IsActive=false`: Resolved/Closed/Completed

        **Response Rules:**
        1. The case list is provided pre-formatted with markdown links. Present it as-is; do not rebuild the links, and never output a URL as bare text or on its own line.
        2. State handling:
           - "open AND resolved" → Return both states
           - "new/in-progress/closed" → Treat as combined state request
        3. No cases? → "No matching cases found."
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent: {}
        actions:
          - kind: ConditionGroup
            id: conditionGroup_N5rG9U
            conditions:
              - id: conditionItem_iqq775
                condition: =IsBlank(Topic.IsActive)
                actions:
                  - kind: SetVariable
                    id: setVariable_O30xeX
                    variable: Topic.IsActive
                    value: =true

          - kind: ConditionGroup
            id: conditionGroup_pinREe
            conditions:
              - id: conditionItem_0D47zU
                condition: =Topic.IsActive = true && !IsBlank(Global.ESS_ServiceNow_HRSD_ActiveCases) && !IsBlank(Global.ESS_ServiceNow_HRSD_NextActiveCasesRefresh) && Global.ESS_ServiceNow_HRSD_NextActiveCasesRefresh > Now()
                actions:
                  - kind: SetVariable
                    id: setVariable_Cs59tT
                    variable: Topic.ServiceNowData
                    value: =Global.ESS_ServiceNow_HRSD_ActiveCases

                  - kind: SetVariable
                    id: setVariable_buildCasesMarkdownCache
                    variable: Topic.CasesMarkdown
                    value: |-
                      =IfError(With({CaseLines: Concat(ForAll(ParseJSON(Topic.ServiceNowData) As Case, If(IsBlank(Text(Case.ServiceNowPortalBaseURI)) || IsBlank(Text(Case.SysId)), "**" & Text(Case.CaseNumber) & "**: " & Text(Case.ShortDescription) & " (" & Text(Case.State) & ")", "**[" & Text(Case.CaseNumber) & "](" & Text(Case.ServiceNowPortalBaseURI) & "?id=ticket&table=sn_hr_core_case&sys_id=" & Text(Case.SysId) & ")**: " & Text(Case.ShortDescription) & " (" & Text(Case.State) & ")")), Value, Char(10))}, If(IsBlank(CaseLines), "", CaseLines)), "")

                  - kind: ConditionGroup
                    id: conditionGroup_emitCasesCache
                    conditions:
                      - id: conditionItem_hasCasesCache
                        condition: =!IsBlank(Topic.CasesMarkdown)
                        actions:
                          - kind: SendActivity
                            id: sendActivity_emitCasesCache
                            activity: "{Topic.CasesMarkdown}"

                  - kind: EndDialog
                    id: jj97Ea

          - kind: SetVariable
            id: setVariable_rxVJHE
            variable: Topic.InputParameters
            value: |-
              ="[
                  { ""Name"": ""IsActive"", ""Value"": """ & Text(Topic.IsActive) & """}
              ]"

          - kind: BeginDialog
            id: 90S4wV
            input:
              binding:
                InputParameters: =Topic.InputParameters
                IsActive: =Topic.IsActive
                UserIdentifier: =Global.ESS_UserContext_UPN

            dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDSystemGetCasesList
            output:
              binding:
                ServiceNowData: Topic.ServiceNowData

          - kind: SetVariable
            id: setVariable_buildCasesMarkdown
            variable: Topic.CasesMarkdown
            value: |-
              =IfError(With({CaseLines: Concat(ForAll(ParseJSON(Topic.ServiceNowData) As Case, If(IsBlank(Text(Case.ServiceNowPortalBaseURI)) || IsBlank(Text(Case.SysId)), "**" & Text(Case.CaseNumber) & "**: " & Text(Case.ShortDescription) & " (" & Text(Case.State) & ")", "**[" & Text(Case.CaseNumber) & "](" & Text(Case.ServiceNowPortalBaseURI) & "?id=ticket&table=sn_hr_core_case&sys_id=" & Text(Case.SysId) & ")**: " & Text(Case.ShortDescription) & " (" & Text(Case.State) & ")")), Value, Char(10))}, If(IsBlank(CaseLines), "", CaseLines)), "")

          - kind: ConditionGroup
            id: conditionGroup_emitCases
            conditions:
              - id: conditionItem_hasCases
                condition: =!IsBlank(Topic.CasesMarkdown)
                actions:
                  - kind: SendActivity
                    id: sendActivity_voCxul
                    activity: "{Topic.CasesMarkdown}"

      inputType:
        properties:
          IsActive:
            displayName: IsActive
            description: |-
              This variable indicates the state of the cases the user wants to fetch. It is a boolean value that defaults to true unless specified otherwise.
              For active, open, or new cases, "IsActive" will be true; for resolved cases also "IsActive" will be true, and for closed cases, "IsActive" will be false.
            type: Boolean

      outputType:
        properties:
          ServiceNowData:
            displayName: ServiceNowData
            description: List of Cases data returned from ServiceNow.
            type: String

