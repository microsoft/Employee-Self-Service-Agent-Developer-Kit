    displayName: ServiceNow HRSD Get Case Details
    id: a63e1b9a-95f6-457d-956f-e7dc15bb94bc
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Active
    status: Active
    schemaName: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDGetCaseDetails
    dialog:
      inputs:
        - kind: AutomaticTaskInput
          propertyName: CaseNumber
          description: The HR case number provided by the user, which starts with "HRC" followed by digits (e.g., HRC0002763). Extract this from the user's message or conversation history.
          entity: StringPrebuiltEntity
          shouldPromptUser: false

        - kind: AutomaticTaskInput
          propertyName: SysId
          description: The unique 32-character system identifier for the case. Only provide this if it is explicitly available in the conversation history. Do NOT prompt the user for this value.
          entity: StringPrebuiltEntity
          shouldPromptUser: false

        - kind: AutomaticTaskInput
          propertyName: IsActive
          description: |-
            Context hint for case lookup. Set to false if the conversation context indicates the user is asking about a closed/inactive case (e.g., the case was just listed from an inactive cases query). Defaults to true if unknown.
          entity: BooleanPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0

      modelDescription: |-
        Use this topic when the user asks for FULL DETAILS / CONTENTS / STATUS of a SPECIFIC HR case in ServiceNow.

        Trigger when the user mentions:
        - A case ID (starts with "HRC")
        - Phrases like "what is in my case", "details of my case", "show me my case", "open my case", "info on case HRC..."
        - "latest case" or "recently created case" wanting contents/status
        - "status of HR case <ID>"

        SysId resolution:
        - A case ID starting with "HRC" is NOT a SysId. A SysId is a 32-character unique string that does NOT start with "HRC".
        - Find the SysId from the current message or conversation history.
        - If SysId is missing, FIRST trigger ServiceNow-HRSD-Get-User-Cases to retrieve the user's cases, THEN use the matching case's SysId with ServiceNowHRSDGetCaseDetails.
        - If no SysId can be found, respond that no cases could be found.

        Response:
        - Show the case number once as the markdown link [HRC...](url) — never bold text, a bare URL, or a separate "available at" / "Label: URL" line.

      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent: {}
        actions:
          - kind: ConditionGroup
            id: conditionGroup_resolveId
            conditions:
              - id: conditionItem_hasSysId
                condition: =!IsBlank(Topic.SysId) && Len(Topic.SysId) = 32
            elseActions:
              - kind: ConditionGroup
                id: conditionGroup_hasCaseNum
                conditions:
                  - id: conditionItem_noCaseNum
                    condition: =IsBlank(Topic.CaseNumber) && IsBlank(Topic.SysId)
                    actions:
                      - kind: SendActivity
                        id: sendActivity_noCaseId
                        activity: I couldn't identify which HR case you're asking about. Could you provide the case number (e.g., HRC0002763)?

                      - kind: CancelAllDialogs
                        id: GTTLiY

                elseActions:
                  - kind: SetVariable
                    id: setVariable_primaryIsActive
                    variable: Topic.PrimaryIsActive
                    value: =If(IsBlank(Topic.IsActive), true, Topic.IsActive)

                  - kind: BeginDialog
                    id: beginDialog_getUserCases
                    displayName: Fetch user cases (primary attempt)
                    input:
                      binding:
                        IsActive: =Topic.PrimaryIsActive

                    dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDGetUserCases
                    output:
                      binding:
                        ServiceNowData: Topic.UserCasesData

                  - kind: ParseValue
                    id: parseValue_primaryCases
                    variable: Topic.PrimaryCases
                    valueType:
                      kind: Table
                      properties:
                        CaseNumber:
                          type: String
                          examples:

                        SysId:
                          type: String
                          examples:

                    value: =Topic.UserCasesData

                  - kind: SetVariable
                    id: setVariable_resolvedCase
                    variable: Topic.ResolvedCase
                    value: =LookUp(Topic.PrimaryCases, (!IsBlank(Topic.CaseNumber) && CaseNumber = Topic.CaseNumber) || (!IsBlank(Topic.SysId) && SysId = Topic.SysId))

                  - kind: ConditionGroup
                    id: conditionGroup_resolved
                    conditions:
                      - id: conditionItem_notResolved
                        condition: =IsBlank(Topic.ResolvedCase)
                        actions:
                          - kind: BeginDialog
                            id: beginDialog_fallbackCases
                            displayName: Fetch user cases (fallback with opposite IsActive)
                            input:
                              binding:
                                IsActive: =!Topic.PrimaryIsActive

                            dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDGetUserCases
                            output:
                              binding:
                                ServiceNowData: Topic.FallbackCasesData

                          - kind: ParseValue
                            id: parseValue_fallbackCases
                            variable: Topic.FallbackCases
                            valueType:
                              kind: Table
                              properties:
                                CaseNumber:
                                  type: String
                                  examples:

                                SysId:
                                  type: String
                                  examples:

                            value: =Topic.FallbackCasesData

                          - kind: SetVariable
                            id: setVariable_fallbackResolved
                            variable: Topic.ResolvedCase
                            value: =LookUp(Topic.FallbackCases, (!IsBlank(Topic.CaseNumber) && CaseNumber = Topic.CaseNumber) || (!IsBlank(Topic.SysId) && SysId = Topic.SysId))

                          - kind: ConditionGroup
                            id: conditionGroup_fallbackResolved
                            conditions:
                              - id: conditionItem_fallbackNotFound
                                condition: =IsBlank(Topic.ResolvedCase)
                                actions:
                                  - kind: SendActivity
                                    id: sendActivity_notFound
                                    activity: I couldn't find that case in your HR cases. Please verify the case number and try again.

                                  - kind: CancelAllDialogs
                                    id: GTSLip

                  - kind: SetVariable
                    id: setVariable_resolvedSysId
                    variable: Topic.SysId
                    value: =Topic.ResolvedCase.SysId

          - kind: BeginDialog
            id: UoQmw1
            displayName: Cache lookup with given sysId
            input: {}
            dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDSystemCaseDetailsCacheLookup
            output:
              binding:
                IsCaseCached: Topic.IsCaseCached

          - kind: ConditionGroup
            id: conditionGroup_grbhAQ
            conditions:
              - id: conditionItem_9C7Yg2
                condition: =Topic.IsCaseCached = true
                actions:
                  - kind: SetVariable
                    id: setVariable_8LRgSh
                    variable: Topic.ServiceNowData
                    value: =Global.ESS_ServiceNow_HRSD_CaseDetails

            elseActions:
              - kind: BeginDialog
                id: 30gNqe
                displayName: Fetch case details from ISV
                input:
                  binding:
                    SysId: =Topic.SysId

                dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDSystemGetCaseDetails
                output:
                  binding:
                    ServiceNowData: Topic.ServiceNowData

          - kind: ParseValue
            id: initializeCaseDetails
            variable: Topic.CaseDetails
            valueType:
              kind: Record
              properties:
                AssignedTo: String
                CaseNumber: String
                Description: String
                HRService: String
                LastUpdated: String
                OpenedFor: String
                Priority: String
                ServiceNowPortalBaseURI: String
                ShortDescription: String
                State: String
                SubjectPerson: String
                SysId: String

            value: ="{}"

          - kind: ParseValue
            id: KjF1kJ
            variable: Topic.CaseDetailsList
            valueType:
              kind: Table
              properties:
                AssignedTo: String
                CaseNumber: String
                Description: String
                HRService: String
                LastUpdated: String
                OpenedFor: String
                Priority: String
                ServiceNowPortalBaseURI: String
                ShortDescription: String
                State: String
                SubjectPerson: String
                SysId: String

            value: =Topic.ServiceNowData

          - kind: SetVariable
            id: selectFirstCaseDetails
            variable: Topic.CaseDetails
            value: =First(Topic.CaseDetailsList)

          - kind: SetVariable
            id: setVariable_ip1tOg
            variable: Topic.CaseDetails.Description
            value: =PlainText(Topic.CaseDetails.Description)

          - kind: SetTextVariable
            id: setVariable_SitJ5l
            variable: Topic.HRCaseTitle
            value: "HR Case #{Topic.CaseDetails.CaseNumber}"

          - kind: SetTextVariable
            id: setVariable_buildCaseLink
            variable: Topic.CaseLinkMarkdown
            value: |-
              ="[" & Text(Topic.CaseDetails.CaseNumber) & "](" & Text(Topic.CaseDetails.ServiceNowPortalBaseURI) & "?id=ticket&table=sn_hr_core_case&sys_id=" & Text(Topic.CaseDetails.SysId) & ")"

          - kind: ConditionGroup
            id: conditionGroup_emitCaseLink
            conditions:
              - id: conditionItem_hasCaseLink
                condition: =!IsBlank(Topic.CaseDetails.ServiceNowPortalBaseURI) && !IsBlank(Topic.CaseDetails.CaseNumber) && !IsBlank(Topic.CaseDetails.SysId)
                actions:
                  - kind: SendActivity
                    id: sendActivity_emitCaseLink
                    activity: "{Topic.CaseLinkMarkdown}"

          - kind: SendActivity
            id: sendActivity_ly3T2X
            activity:
              text:
                - You can view the HR case details below.
              attachments:
                - kind: AdaptiveCardTemplate
                  cardContent: |-
                    ={
                      type: "AdaptiveCard",
                      '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                      version: "1.5",
                      body: [
                        {
                          type: "Container",
                          items: [
                            {
                              type: "RichTextBlock",
                              inlines: [
                                {
                                  type: "TextRun",
                                  text: Topic.HRCaseTitle,
                                  weight: "Bolder"
                                }
                              ]
                            },
                            {
                              type: "TextBlock",
                              text: Topic.CaseDetails.ShortDescription,
                              wrap: true,
                              weight: "Bolder",
                              size: "Medium"
                            },
                            {
                              type: "ColumnSet",
                              columns: [
                                {
                                  type: "Column",
                                  width: "50",
                                  items: [
                                    {
                                      type: "TextBlock",
                                      text: "Status",
                                      isSubtle: true,
                                      wrap: true
                                    },
                                    {
                                      type: "TextBlock",
                                      text: Topic.CaseDetails.State,
                                      color: If(Topic.CaseDetails.State = "Active", "good", "default"),
                                      wrap: true,
                                      weight: "Bolder",
                                      spacing: "None"
                                    }
                                  ]
                                },
                                {
                                  type: "Column",
                                  width: "50",
                                  items: [
                                    {
                                      type: "TextBlock",
                                      text: "Priority",
                                      wrap: true,
                                      isSubtle: true
                                    },
                                    {
                                      type: "TextBlock",
                                      text: If(IsBlank(Topic.CaseDetails.Priority), "NA", Topic.CaseDetails.Priority),
                                      weight: "Bolder",
                                      wrap: true,
                                      spacing: "None"
                                    }
                                  ]
                                }
                              ]
                            },
                            {
                              type: "ColumnSet",
                              columns: [
                                {
                                  type: "Column",
                                  width: "50",
                                  items: [
                                    {
                                      type: "TextBlock",
                                      text: "Agent Assigned",
                                      isSubtle: true,
                                      wrap: true
                                    },
                                    {
                                      type: "TextBlock",
                                      text: If(IsBlank(Topic.CaseDetails.AssignedTo), "NA", ParseJSON(Topic.CaseDetails.AssignedTo).display_value),
