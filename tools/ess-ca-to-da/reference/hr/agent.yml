                state: String
                subject_person:
                  type:
                    kind: Record
                    properties:
                      display_value: String
                      link: String

                sys_id: String
                sys_updated_on: String

            value: =JSON(Topic.CreateRecordResultAny)

          - kind: ConditionGroup
            id: validateCreatedCase
            conditions:
              - id: createdCaseMissingIdentifier
                condition: =IsBlank(Topic.CreatedCase.sys_id) || IsBlank(Topic.CreatedCase.number)
                actions:
