    displayName: "Workday Get CompanyCode"
    id: ee09966b-c657-434a-b57e-5033bdcc6991
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfservicehr.topic.WorkdayCompanyCode
    dialog:
      useVerbatimOutputMessages: true
      modelDescription: |-
        Use this topic when the user asks about THEIR OWN company code stored in Workday — including legal entity, employing entity, company name, payroll company, business unit
        code, or the company they are officially employed by. Data belongs exclusively to the requesting user.

        Valid: "What is my company code?", "Which legal entity am I employed by?", "What's my employing company?", "Show my payroll company", "What company code is on my Workday
        profile?"

        do NOT trigger for general questions about subsidiaries, org structure, or company policy they are out of scope.
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - "What is my company code?"
        actions:
          - kind: ConditionGroup
            id: ensureWorkdayContext
            conditions:
              - id: ensureWorkdayContextWhenMissing
                condition: =IsBlank(Global.ESS_UserContext_Employee_Id) || Global.ESS_UserContext_Employee_Id = """"""
                displayName: Initialize Workday user context when needed
                actions:
                  - kind: BeginDialog
                    id: callWorkdayUserContext
                    displayName: Retrieve the current Workday user context
                    dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemGetUserContextV2

          - kind: BeginDialog
            id: dZAI4Y
            displayName: Redirect to Workday Get Common Execution
            input:
              binding:
                parameters: ="{""params"":" & JSON(Table({key:"{Employee_ID}", value:Coalesce(Global.ESS_UserContext_Employee_Id, "")},{key:"{As_Of_Effective_Date}", value:Text(Today(), "yyyy-MM-dd")})) & "}"
                scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetCompanyCode

            dialog: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemGetCommonExecution
            output:
              binding:
                errorResponse: Topic.errorResponse
                isSuccess: Topic.isSuccess
                workdayResponse: Topic.workdayResponse

          - kind: ParseValue
            id: fP9fKn
            displayName: Parse workdayResponse
            variable: Topic.parsedWorkdayResponse
            valueType:
              kind: Record
              properties:
                CompanyData:
                  type:
                    kind: Table
                    properties:
                      Organization_Code: String
                      Organization_Name: String

            value: =Topic.workdayResponse

          - kind: SetVariable
            id: setVariable_LHTcFu
            displayName: Set finalized data
            variable: Topic.finalizedData
            value: |-
              ={
                  EmployeeName: Global.ESS_UserContext_Employee_Firstname & " " & Global.ESS_UserContext_Employee_Lastname,
                  CompanyCode: First(Topic.parsedWorkdayResponse.CompanyData).Organization_Code,
                  CompanyName:First(Topic.parsedWorkdayResponse.CompanyData).Organization_Name
              }

          - kind: SendActivity
            id: sendActivity_L8qtnT
            activity: Your company code is {Topic.finalizedData.CompanyCode}, which corresponds to {Topic.finalizedData.CompanyName}.

      inputType: {}
      outputType:
        properties:
          finalizedData:
            displayName: finalizedData
            type:
              kind: Record
              properties:
                CompanyCode: String
                CompanyName: String
                EmployeeName: String
