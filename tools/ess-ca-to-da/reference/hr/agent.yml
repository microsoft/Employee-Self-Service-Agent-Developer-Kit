    displayName: ServiceNow HRSD Update Case
    id: fa8aecb0-7c2c-4e5f-89bc-77c7842bfc22
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Active
    status: Active
    schemaName: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDUpdateCase
    dialog:
      inputs:
        - kind: AutomaticTaskInput
          propertyName: State
          description: This can take two values, "Active" or "Awaiting Acceptance". Identify from the user's conversation whether the updated case will be "Active" or "Awaiting Acceptance". If the state is not identified, default to "Active".
          entity: StringPrebuiltEntity
          shouldPromptUser: false

        - kind: AutomaticTaskInput
          propertyName: Comment
          name: Comment
          description: Extract the comment only if the user explicitly includes one in their current message. If no comment is present, leave this blank — this tool will collect it via an adaptive card form.
          entity: StringPrebuiltEntity
          shouldPromptUser: false

        - kind: AutomaticTaskInput
          propertyName: CaseIdentifier
          description: |-
            `CaseIdentifier` is a unique value used to identify an HR case.

            There are only two valid types of CaseIdentifiers:
            1. **SysID**
              - A globally unique 32-character identifier.
              - Format: hexadecimal string (digits 0-9 and lowercase letters a-f).
              - Regex: `^[a-f0-9]{32}$`
            2. **CaseNumber**
              - A unique identifier between 8-14 characters.
              - Format: Always starts with the prefix `HRC` followed by digits.
              - Regex: `^HRC\d{5,}$`

            If neither identifier is available, use the tool `ServiceNow-HRSD-Get-User-Cases` to extract the `CaseIdentifier` from its response.

            **Important:** The extracted `SysID` or `CaseNumber` must be an exact match with the user query. Partial or fuzzy matches are not valid.
          entity: StringPrebuiltEntity
          shouldPromptUser: false

        - kind: AutomaticTaskInput
          propertyName: RelevantCaseFound
          description: |-
            `RelevantCaseFound` is a boolean value that indicates whether a matching case was found based on the user's input.

            Set `RelevantCaseFound = true` **only if** one of the following conditions is met:
            1. **Exact Identifier Match**
              - The user provides a `CaseNumber` (8-14 characters, starts with `"HRC"`) or a `SysID` (32-character hexadecimal string: digits `0-9` and lowercase letters `a-f`).

            2. **High-Relevance Descriptive Match**
              - The user provides a descriptive query (e.g., "my payroll case").
              - Use the tool `ServiceNow-HRSD-Get-User-Cases` to get user's cases.
              - A case in the list must match with **VERY HIGH SEMANTIC RELEVANCE** to user query.
              - If the match is partial, uncertain, or low-confidence, set `RelevantCaseFound = false`.

            **Do not set `RelevantCaseFound = true` for partial, fuzzy, or ambiguous matches.**
          entity: BooleanPrebuiltEntity
          shouldPromptUser: false

      modelDisplayName: ServiceNow HRSD Update Case
      modelDescription: |-
        Updates a specific HR case identified by SysId or CaseNumber. Use it to add information, comments, notes, replies, or remarks; change status; or resolve the case. For attachments, files, or documents, use ServiceNow HRSD Add Attachments or Comments To Case. Its adaptive card collects update details, so do not ask for comments or resolution details before invoking it.

        If the SysId for the case is missing, the tool ServiceNow-HRSD-Get-User-Cases must be triggered first to retrieve the list of cases associated with the user.

        If SysId is still unclear, present a list in this format and ask the user to select the correct case:
        **{CaseNumber}** – {ShortDescription}

        In the next step, use the SysId of the relevant case to update the case using ServiceNow-HRSD-Update-Case tool.

        Example queries handled by this tool include:
        * "Update my HR case"
        * "Add a comment to my case"
        * "Change the status of my HR case"
        * "Resolve my case"
        * "I want to update HRC###"
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent: {}
        actions:
          - kind: ConditionGroup
            id: conditionGroup_2Lo78P
            conditions:
              - id: conditionItem_uye4lw
                condition: =Topic.RelevantCaseFound = true
                displayName: Is a relevant case found?
                actions:
                  - kind: BeginDialog
                    id: QUaZAR
                    input:
                      binding:
                        SysId: =Topic.CaseIdentifier

                    dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDSystemUserPermissionCheck
                    output:
                      binding:
                        CaseDetails: Topic.CaseDetails

                  - kind: ConditionGroup
                    id: conditionGroup_zL1Y3f
                    conditions:
                      - id: conditionItem_GU4cdw
                        condition: =IsBlank(Topic.State)
                        actions:
                          - kind: SetVariable
                            id: setVariable_pXG8vC
                            variable: Topic.State
                            value: ="Active"

                  - kind: ConditionGroup
                    id: conditionGroup_c5ryMg
                    conditions:
                      - id: conditionItem_yCYWPB
                        condition: =Topic.CaseDetails.State = "Closed" || Topic.CaseDetails.State = "Cancelled"
                        displayName: Check if case is already Cancelled or Closed
                        actions:
                          - kind: SendActivity
                            id: sendActivity_GDoMdX
                            activity: |-
                              Your HR case was **closed** on **{Text(DateTimeValue(Topic.CaseDetails.LastUpdated), "mmmm dd, yyyy")}**. You can't update this case.

                              If you still need help with an HR issue, I'm here to assist. Just let me know what you need help with.

                          - kind: EndDialog
                            id: gdJk2Y

                      - id: conditionItem_XEQSI7
                        condition: =Topic.CaseDetails.State = "Resolved"
                        actions:
                          - kind: SendActivity
                            id: sendActivity_x4nhJj
                            activity: |-
                              Your HR case was **resolved** on **{Text(DateTimeValue(Topic.CaseDetails.LastUpdated), "mmmm dd, yyyy")}**. You can reopen the case from the [Service Portal]({Concatenate(Topic.CaseDetails.ServiceNowPortalBaseURI,"?id=ticket&table=sn_hr_core_case&sys_id="&Topic.CaseDetails.SysId)})

                              If you still need help with an HR issue, I'm here to assist. Just let me know what you need help with.

                          - kind: EndDialog
                            id: V6SpRF

                  - kind: SendActivity
                    id: sendActivity_wwRsSl
                    activity: Complete the form below to add a comment or resolve the case.

                  - kind: AdaptiveCardPrompt
                    id: UWEgCl
                    card: |-
                      ={
                        type: "AdaptiveCard",
                        '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                        version: "1.5",
                        body: [
                          {
                            type: "Container",
                            items: [
                              {
                                type: "TextBlock",
                                text: "HR Case #" & Topic.CaseDetails.CaseNumber,
                                weight: "Bolder"
                              },
                              {
                                type: "TextBlock",
                                text: Topic.CaseDetails.ShortDescription,
                                wrap: true,
                                weight: "Bolder",
                                size: "Medium"
                              },
                              {
                                type: "Input.Toggle",
                                title: "Resolve Case",
                                spacing: "Medium",
                                valueOn: "Awaiting Acceptance",
                                valueOff: "Active",
                                id: "state",
                                value: Topic.State
                              },
                              {
                                type: "Input.Text",
                                placeholder: "Enter comment",
                                spacing: "Medium",
                                isMultiline: true,
                                isRequired: true,
                                errorMessage: "Please enter comment",
                                label: "Add comments",
                                id: "comment",
                                value: Topic.Comment
                              }
                            ]
                          },
                          {
                            type: "Container",
                            spacing: "Medium",
                            items: [
                              {
                                type: "ActionSet",
                                actions: [
                                  {
                                    type: "Action.Submit",
                                    title: "Submit",
                                    associatedInputs: "auto"
                                  },
                                  {
                                    type: "Action.Submit",
                                    title: "Cancel",
                                    associatedInputs: "none"
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    output:
                      binding:
                        actionSubmitId: Topic.actionSubmitId
                        comment: Topic.Comment
                        state: Topic.State

                    outputType:
                      properties:
                        actionSubmitId:
                          type: String
                          examples:

                        comment:
                          type: String
                          examples:

                        state:
                          type: String
                          examples:

                  - kind: ConditionGroup
                    id: conditionGroup_9qTuJB
                    conditions:
                      - id: conditionItem_RN14x6
                        condition: =Topic.actionSubmitId = "Cancel"
                        displayName: User clicked on cancel?
                        actions:
                          - kind: AdaptiveCardPrompt
                            id: TDsyBI
                            interruptionPolicy:
                              allowInterruption: false

                            card: |
                              ={
                                type: "AdaptiveCard",
                                '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                                version: "1.5",
                                body: [
                                  {
                                    type: "TextBlock",
                                    text: "Are you sure you want to cancel? Any changes you made won't be saved.",
                                    wrap: true
                                  },
                                  {
                                    type: "Container",
                                    items: [
                                      {
                                        type: "ActionSet",
                                        actions: [
                                          {
                                            type: "Action.Submit",
                                            title: "Yes, cancel",
                                            associatedInputs: "none"
                                          },
                                          {
                                            type: "Action.Submit",
                                            title: "No, keep editing",
                                            associatedInputs: "none"
                                          }
                                        ]
                                      }
                                    ]
                                  }
                                ]
                              }


                            output:
                              binding:
                                actionSubmitId: Topic.actionSubmitId

                            outputType:
                              properties:
                                actionSubmitId:
                                  type: String
                                  examples:

                          - kind: ConditionGroup
                            id: conditionGroup_NBF0Gn
                            conditions:
                              - id: conditionItem_gwk7J3
                                condition: =Topic.actionSubmitId = "Yes, cancel"
                                actions:
                                  - kind: SendActivity
                                    id: sendActivity_ikOOrc
                                    activity: "Ok, I've canceled edits to case #{Topic.CaseDetails.CaseNumber}. Is there anything else you need help with?"

                              - id: conditionItem_MCIGD2
                                condition: =Topic.actionSubmitId = "No, keep editing"
                                actions:
                                  - kind: SendActivity
                                    id: sendActivity_cv02hQ
                                    activity: Let's give this another shot. Please resolve this case or leave a comment in the form.

                                  - kind: GotoAction
                                    id: YKJ9wZ
                                    actionId: UWEgCl

                            elseActions:
                              - kind: SendActivity
                                id: sendActivity_DX9eV9
                                activity: Please select one of the two suggestions.

                              - kind: GotoAction
                                id: LtCegs
                                actionId: TDsyBI

                          - kind: EndDialog
                            id: Jk5ahm

                  - kind: SendActivity
                    id: sendActivity_q3KmVn
                    activity: Thanks, I'm submitting your changes to ServiceNow.

                  - kind: SetVariable
                    id: setVariable_RcHZvC
                    variable: Topic.InputParameters
                    value: |-
                      =JSON(Table(
                          {
                              Name: "Comment",
                              Value: Topic.Comment
                          },
                          {
                              Name: "State",
                              Value: Topic.State
                          },
                          {
                              Name: "CloseNotes",
                              Value: If(Topic.State = "Awaiting Acceptance", "HR case submitted for closure by caller from Employee Self Service; pending attestation.", "")
                          },
                          {
                              Name: "ResolutionCode",
                              Value: If(Topic.State = "Awaiting Acceptance", "Resolved by Caller", "")
                          }
                      ))

                  - kind: BeginDialog
                    id: wKJDLk
                    input:
                      binding:
                        InputParameters: =Topic.InputParameters
                        SysId: =Topic.CaseDetails.SysId

                    dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDSystemUpdateCase
                    output:
                      binding:
                        ServiceNowData: Topic.ServiceNowData
                        IsSuccessful: Topic.IsSuccessful

                  - kind: ConditionGroup
                    id: conditionGroup_updateResultCheck
                    conditions:
                      - id: conditionItem_updateFailed
                        condition: =Topic.IsSuccessful = false
                        displayName: Update failed (IsSuccessful=false from SystemCommonExecution; covers HTTP 404 with non-blank error.message AND HTTP 200 with empty result)
                        actions:
                          - kind: SendActivity
                            id: sendActivity_updateFailed
                            activity: "I couldn't update your HR case. Please try again or contact your HR representative if the problem persists."

                          - kind: EndDialog
                            id: endDialog_updateFailed

                  - kind: ConditionGroup
                    id: conditionGroup_prc8uJ
                    conditions:
                      - id: conditionItem_XruD9u
                        condition: =Topic.State = "Awaiting Acceptance"
                        displayName: Case submitted for closure (Awaiting Acceptance)?
                        actions:
                          - kind: SendActivity
                            id: sendActivity_X7gbxW
                            activity: "Your HR case {\"[#\"& Topic.CaseDetails.CaseNumber &\"](\"&Topic.CaseDetails.ServiceNowPortalBaseURI& \"?id=ticket&table=sn_hr_core_case&sys_id=\"&Topic.CaseDetails.SysId&\")\"} has been submitted for closure and is awaiting your attestation. Please open the case in the Service Portal to attest and complete the closure. Thank you for updating your case."

                    elseActions:
                      - kind: SendActivity
                        id: sendActivity_CygHgL
                        activity: "Your HR case {\"[#\" &Topic.CaseDetails.CaseNumber &\"](\"&Topic.CaseDetails.ServiceNowPortalBaseURI& \"?id=ticket&table=sn_hr_core_case&sys_id=\"&Topic.CaseDetails.SysId&\")\"} has been updated successfully. An HR representative will reach out to you soon. If you need any further assistance, just let me know. I'm here to help!"

                  - kind: EndDialog
                    id: EVyYOc

            elseActions:
              - kind: SetVariable
                id: setVariable_LygoHz
                variable: Topic.RelevantCaseFound
                value: false

      inputType:
        properties:
          Comment:
            displayName: Comment
            description: Extract the comment only if the user explicitly includes one in their current message. If no comment is present, leave this blank — this tool will collect it via an adaptive card form.
            type: String
            examples:

          RelevantCaseFound:
            displayName: RelevantCaseFound
            description: |-
              `RelevantCaseFound` is a boolean value that indicates whether a matching case was found based on the user's input.

              Set `RelevantCaseFound = true` **only if** one of the following conditions is met:
              1. **Exact Identifier Match**
                - The user provides a `CaseNumber` (8-14 characters, starts with `"HRC"`) or a `SysID` (32-character hexadecimal string: digits `0-9` and lowercase letters `a-f`).

              2. **High-Relevance Descriptive Match**
                - The user provides a descriptive query (e.g., "my payroll case").
                - Use the tool `ServiceNow-HRSD-Get-User-Cases` to get user's cases.
                - A case in the list must match with **VERY HIGH SEMANTIC RELEVANCE** to user query.
                - If the match is partial, uncertain, or low-confidence, set `RelevantCaseFound = false`.

              **Do not set `RelevantCaseFound = true` for partial, fuzzy, or ambiguous matches.**
            type: Boolean
            examples:

          State:
            displayName: State
            description: This can take two values, "Active" or "Awaiting Acceptance". Identify from the user's conversation whether the updated case will be "Active" or "Awaiting Acceptance". If the state is not identified, default to "Active".
            type: String
            examples:

          CaseIdentifier:
            displayName: CaseIdentifier
            description: |-
              `CaseIdentifier` is a unique value used to identify an HR case.

              There are only two valid types of CaseIdentifiers:
              1. **SysID**
                - A globally unique 32-character identifier.
                - Format: hexadecimal string (digits 0-9 and lowercase letters a-f).
                - Regex: `^[a-f0-9]{32}$`
              2. **CaseNumber**
                - A unique identifier between 8-14 characters.
                - Format: Always starts with the prefix `HRC` followed by digits.
                - Regex: `^HRC\d{5,}$`

              If neither identifier is available, use the tool `ServiceNow-HRSD-Get-User-Cases` to extract the `CaseIdentifier` from its response.

              **Important:** The extracted `SysID` or `CaseNumber` must be an exact match with the user query. Partial or fuzzy matches are not valid.
            type: String
            examples:

      outputType:
        properties:
          RelevantCaseFound:
            displayName: RelevantCaseFound
            type: Boolean
            examples:

