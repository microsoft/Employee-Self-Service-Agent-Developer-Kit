            displayName: "Official Answer "
            card: |-
              ={
                type: "AdaptiveCard",
                '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                version: 1,
                body: [
                  {
                    type: "ColumnSet",
                    columns: [
                      {
                        type: "Column",
                        width: "auto",
                        items: [
                          {
                            type: "Image",
                            url: "data:image/png;base64,"
                          }
                        ],
                        verticalContentAlignment: "Center"
                      },
