            id: resolveCreateInputValues
            variable: Topic.CreateInputValues
            valueType:
              kind: Record
              properties:
                ContactType: String
                HRService: String
                OpenedFor: String
                Priority: String
                SubjectPerson: String
                WorkNotes: String

            value: |-
              ={
                  HRService: Coalesce(LookUp(Topic.CreateParameters, Name = "HRService").Value, ""),
                  SubjectPerson: Coalesce(LookUp(Topic.CreateParameters, Name = "SubjectPerson").Value, ""),
                  OpenedFor: Coalesce(LookUp(Topic.CreateParameters, Name = "OpenedFor").Value, ""),
                  ContactType: Coalesce(LookUp(Topic.CreateParameters, Name = "ContactType").Value, ""),
                  WorkNotes: Coalesce(LookUp(Topic.CreateParameters, Name = "WorkNotes").Value, ""),
                  Priority: Global.ServiceNowHRSDDefaultCreatePriority
              }

          - kind: ParseValue
            id: buildCreateRecordBody
            variable: Topic.CreateRecordBody
            valueType:
              kind: Record
              properties:
                contact_type: String
                hr_service: String
                opened_for: String
                priority: String
                subject_person: String
                work_notes: String

            value: |-
              ={
                  hr_service: Topic.CreateInputValues.HRService,
                  subject_person: Topic.CreateInputValues.SubjectPerson,
                  opened_for: Topic.CreateInputValues.OpenedFor,
                  contact_type: Topic.CreateInputValues.ContactType,
                  work_notes: Topic.CreateInputValues.WorkNotes,
                  priority: Topic.CreateInputValues.Priority
              }

