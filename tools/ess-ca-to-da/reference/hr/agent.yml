    dialog:
      modelDescription: |-
        Use this topic when the user asks for the LATEST UPDATE or RECENT ACTIVITY on their HR case(s) in ServiceNow — what's new, what changed, latest activity, recent notes/comments, case progress, last action, who's working on it, when it was last touched.

        Trigger phrases: "updates on my case", "activity on my case", "what changed", "new notes", "what happened on my case", "any progress", "latest on my HR ticket", "is anyone working on my case".

        Instructions:
        1. Check ServiceNowData for HR cases. If no conversation history is found, trigger this topic and fetch data into ServiceNowData.
        2. If no cases are found, politely inform the user and END this topic.
        3. If cases exist, use the first record to respond:
        "Your latest HR case **{Casenumber}** is on **{ShortDescription}**. The case is **assigned to {AssignedTo}** and it has been worked on since **{LastUpdatedOn}**."
        Display the date as: Month Date, Year.
        4. If the user wants FULL details or deeper info on a case, route to the "Get Case Details" topic.
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent: {}
        actions:
          - kind: BeginDialog
            id: 6ve11q
            input: {}
            dialog: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDGetUserCases
            output:
              binding:
                ServiceNowData: Topic.ServiceNowData

      outputType:
        properties:
          ServiceNowData:
            displayName: ServiceNowData
            type: String

