    schemaName: gptagent_copilotforemployeeselfservicehr.topic.ServiceNowHRSDAddAttachmentsorCommentsToCase
    dialog:
      modelDisplayName: ServiceNow HRSD Add Attachments or Comments To Case
      modelDescription: |-
        Use this topic ONLY when the user explicitly asks to ADD A COMMENT, NOTE, REPLY, REMARK, or ATTACHMENT / FILE / DOCUMENT to a SPECIFIC existing HR case / HR ticket in ServiceNow.

        Trigger phrases:
        - "Add a comment / note / reply on my case"
        - "Comment on case HRC..."
        - "Attach a file / document / screenshot to my case"
        - "Upload an attachment to case ..."
        - "Post an update on my HR ticket"
        - "Append a note to case ..."
        - "Share a file with HR on case ..."

        Identify the SysId from the current message and conversation history.
        - A SysId is a 32-character unique identifier and DOES NOT start with "HRC".
        - A case ID starts with "HRC" and is NOT a SysId.
        - If no SysId is found, trigger "ServiceNow HRSD Get User Cases" first, then use the matching
         case's SysId.
        - If the cases list is empty, respond that no cases could be found.

        Do NOT trigger for: creating a new case, asking for case details/status, asking for case updates, or general comments not tied to a specific case.
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent: {}
        actions:
          - kind: SendActivity
            id: sendActivity_SNJknk
            activity: This action is not supported yet. Please try re-phrasing your query or ask me something else.

