            dynamicOutputSchema:
              kind: Record
              properties:
                result:
                  order: 0
                  type: Any

            operationId: CreateRecord

          - kind: ParseValue
            id: parseCreatedCase
            variable: Topic.CreatedCase
            valueType:
              kind: Record
              properties:
