                        type: "Column",
                        width: "stretch",
                        items: [
                          {
                            type: "TextBlock",
                            text: "Official Answer",
                            wrap: true,
                            size: "Small",
                            weight: "Lighter",
                            color: "Default",
                            isSubtle: true,
                            height: "stretch"
                          }
                        ],
                        spacing: "Small",
                        verticalContentAlignment: "Bottom"
                      }
                    ],
                    spacing: "None",
                    horizontalAlignment: "Left",
                    height: "stretch"
                  },
                  {
                    type: "TextBlock",
                    text: Topic.VerbatimResponse,
                    wrap: true
                  }
                ]
              }
            output: {}
            outputType: {}

