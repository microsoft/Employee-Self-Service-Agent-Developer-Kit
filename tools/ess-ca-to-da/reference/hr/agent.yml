    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfservicehr.topic.WorkdaySystemRefreshReferenceData
    dialog:
      useVerbatimOutputMessages: true
      inputs:
        - kind: ManualTaskInput
          propertyName: IsTableEmpty
          value: =Topic.IsTableEmpty

        - kind: ManualTaskInput
          propertyName: ReferenceDataKey
          value: =Topic.ReferenceDataKey

      beginDialog:
        kind: OnRedirect
        id: main
        actions:
          - kind: SetVariable
            id: setVariable_ShRcvN
            displayName: Set refresh interval in hours
            variable: Topic.RefreshInterval
            value: =12

          - kind: ConditionGroup
            id: conditionGroup_0tfrDU
            conditions:
              - id: conditionItem_A0TWAV
                condition: =Topic.IsTableEmpty = true || IsBlank(Global.ReferenceData_NextRefreshDatetime) || Global.ReferenceData_NextRefreshDatetime < Now()
                displayName: If requested table is empty or needs refreshing
                actions:
                  - kind: BeginDialog
                    id: qftlyq
                    displayName: Redirect to fetch data from workday
                    input:
                      binding:
                        referenceDataKey: =Topic.ReferenceDataKey

                    dialog: gptagent_copilotforemployeeselfservicehr.topic.GetReferenceData

                  - kind: ConditionGroup
                    id: conditionGroup_nTzNF3
                    conditions:
                      - id: conditionItem_dDmRqK
                        condition: =IsBlank(Global.ReferenceData_NextRefreshDatetime)
                        displayName: If next refresh time has never been set
                        actions:
                          - kind: SetVariable
                            id: setVariable_G8YUBH
                            displayName: Set the next refresh datetime
                            variable: Global.ReferenceData_NextRefreshDatetime
                            value: =DateAdd(Now(), Topic.RefreshInterval, TimeUnit.Hours)

                    elseActions:
                      - kind: SetVariable
                        id: setVariable_Lj4vc8
                        displayName: Set the next refresh time if needed
                        variable: Global.ReferenceData_NextRefreshDatetime
                        value: =If(Global.ReferenceData_NextRefreshDatetime < Now(), DateAdd(Now(), Topic.RefreshInterval, TimeUnit.Hours), Global.ReferenceData_NextRefreshDatetime)

      inputType:
        properties:
          IsTableEmpty:
            displayName: IsTableEmpty
            type: Boolean

          ReferenceDataKey:
            displayName: ReferenceDataKey
            type: String

      outputType: {}
