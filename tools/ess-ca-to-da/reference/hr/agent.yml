                    description: Name of the table to which the attachment is associated.
                    order: 17
                    type: String

                  table_sys_id:
                    description: Sys_id of the table associated with the attachment.
                    order: 18
                    type: String

                  updated_by_name:
                    description: Full name of entity that last updated the attachment file.
                    order: 19
                    type: String

        operationId: UploadAttachmentFile

