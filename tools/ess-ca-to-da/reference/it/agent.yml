  - kind: DialogComponent
    version: 1
    managedProperties:
      isManaged: true
      isCustomizable: true

    auditInfo:
      createdTimeUtc: 2026-09-07T00:00:00.0000000Z
      modifiedTimeUtc: 2026-09-07T00:00:00.0000000Z
      createdBy: b43923a9-9f93-482f-939e-6461def6d786
      modifiedBy: b43923a9-9f93-482f-939e-6461def6d786

    displayName: "Workday Update PhoneNumber"
    id: 01bbc94c-108a-5db1-99d6-046fedec8dbc
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.EmployeeUpdatePhoneNumber
    dialog:
      useVerbatimOutputMessages: true
      inputs:
        - kind: AutomaticTaskInput
          propertyName: ToPhoneNumber
          description: The new phone number to be updated to
          entity: PhoneNumberPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0
            defaultValue: =Blank()

        - kind: AutomaticTaskInput
          propertyName: FromPhoneNumber
          name: ExistingPhoneNumber
          description: The existing phone number to be updated
          entity: PhoneNumberPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0
            defaultValue: =Blank()

      modelDescription: |-
        This tool updates the phone number of the user making the request
        through Workday. ALWAYS invoke this tool when the user expresses
        intent to update, change, add, remove, or modify their phone number,
        mobile number, or contact number, even if they do not provide a
        specific phone number. The tool will prompt the user for any missing
        information through an interactive form.

        When to invoke:
        - "Update my phone number"
        - "I want to update my phone number"
        - "I want to change my phone number"
        - "Update my mobile number"
        - "I need to add a new phone number"
        - "Change my contact number"
        - Any variation of requesting a phone number update for themselves

        Do NOT invoke for:
        - Requests about other people's phone numbers
        - General questions about phone/contact policies
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - "Update my phone number in Workday."
        actions:
          - kind: ConditionGroup
            id: ensureWorkdayContext
            conditions:
              - id: ensureWorkdayContextWhenMissing
                condition: =IsBlank(Global.ESS_UserContext_Employee_Id) || Global.ESS_UserContext_Employee_Id = """"""
                displayName: Initialize Workday user context when needed
                actions:
                  - kind: BeginDialog
                    id: callWorkdayUserContext
                    displayName: Retrieve the current Workday user context
                    dialog: gptagent_copilotforemployeeselfserviceit.topic.WorkdaySystemGetUserContextV2

          - kind: SetVariable
            id: setVariable_flezsQ
            displayName: Set retry count variable
            variable: Topic.retryCountOnError
            value: 3

          - kind: BeginDialog
            id: cCtEea
            displayName: Redirect to Workday Get Common Execution
            input:
              binding:
                parameters: ="{""params"":[{""key"":""{Employee_ID}"",""value"":""" & Global.ESS_UserContext_Employee_Id & """},{""key"":""{As_Of_Effective_Date}"",""value"":"""& Text(Now(), "yyyy-MM-dd") &"""}, {""key"":""{As_Of_Entry_DateTime}"",""value"":"""& Text(Now(), "yyyy-MM-ddTHH:mm:ss") &"""}]}"
                scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetPhoneNumber

            dialog: gptagent_copilotforemployeeselfserviceit.topic.WorkdaySystemGetCommonExecution
            output:
              binding:
                errorResponse: Topic.errorResponse
                isSuccess: Topic.isSuccess
                workdayResponse: Topic.workdayResponse

          - kind: ParseValue
            id: 4r2FJ2
            displayName: Parse Workday response into table
            variable: Topic.tableWorkdayResponse
            valueType:
              kind: Record
              properties:
                PhoneInformationData:
                  type:
                    kind: Table
                    properties:
                      Phone_Data:
                        type:
                          kind: Record
                          properties:
                            "@Formatted_Phone": String
                            Complete_Phone_Number: String
                            Country_Code_Reference:
                              type:
                                kind: Record
                                properties:
                                  "@Descriptor": String
                                  ID:
                                    type:
                                      kind: Table
                                      properties:
                                        "@type": String
                                        "#text": String

                            Device_Type_Reference:
                              type:
                                kind: Record
                                properties:
                                  "@Descriptor": String
                                  ID:
                                    type:
                                      kind: Table
                                      properties:
                                        "@type": String
                                        "#text": String

                      Phone_ID: String
                      Phone_Reference:
                        type:
                          kind: Record
                          properties:
                            "@Descriptor": String
                            ID:
                              type:
                                kind: Table
                                properties:
                                  "@type": String
                                  "#text": String

                      Usage_Data:
                        type:
                          kind: Table
                          properties:
                            "@Public": String
                            Type_Data:
                              type:
                                kind: Record
                                properties:
                                  "@Primary": String
                                  Type_Reference:
                                    type:
                                      kind: Record
                                      properties:
                                        "@Descriptor": String
                                        ID:
                                          type:
                                            kind: Table
                                            properties:
                                              "@type": String
                                              "#text": String

            value: =Topic.workdayResponse

          - kind: SetVariable
            id: VZwuzc
            displayName: Transform and store the table
            variable: Topic.transformedTable
            value: |-
              =Sort(ForAll(Topic.tableWorkdayResponse.PhoneInformationData,
              {
                  id: ThisRecord.Phone_ID,
                  displayPhoneNumber: ThisRecord.Phone_Data.'@Formatted_Phone',
                  countryCodeId: LookUp(ThisRecord.Phone_Data.Country_Code_Reference.ID,'@type' = "Country_Phone_Code_ID",'#text'),
                  phoneNumber: ThisRecord.Phone_Data.Complete_Phone_Number,
                  phoneReference: ThisRecord.Phone_ID,
                  deviceType: LookUp(ThisRecord.Phone_Data.Device_Type_Reference.ID,'@type' = "Phone_Device_Type_ID",'#text'),
                  isPrimary: If(First( ThisRecord.Usage_Data).Type_Data.'@Primary' = "1", true, false),
                  isPublic: If(First( ThisRecord.Usage_Data).'@Public' = "1", true, false)
              }), ThisRecord.isPrimary, SortOrder.Descending)

          - kind: SetVariable
            id: setVariable_sgGu9Q
            displayName: Set existing phone no country code
            variable: Topic.fromPhoneCountryCode
            value: =If(IsBlank(Topic.FromPhoneNumber), "", If(IsBlank(Find("+", Topic.FromPhoneNumber)), Topic.FromPhoneNumber, If(IsBlank(Find(" ", Topic.FromPhoneNumber)), Topic.FromPhoneNumber, Mid(Topic.FromPhoneNumber, Find(" ", Topic.FromPhoneNumber)))))

          - kind: SetVariable
            id: setVariable_XPyw4i
            displayName: Remove country code from from phone
            variable: Topic.FromPhoneNumber
            value: =If(IsBlank(Topic.FromPhoneNumber), "", If(IsBlank(Find("+", Topic.FromPhoneNumber)), Topic.FromPhoneNumber, If(IsBlank(Find(" ", Topic.FromPhoneNumber)), Topic.FromPhoneNumber, Mid(Topic.FromPhoneNumber, Find(" ", Topic.FromPhoneNumber)))))

          - kind: SetVariable
            id: setVariable_SrN0Gm
            displayName: Remove spaces from FromPhoneNo
            variable: Topic.FromPhoneNumber
            value: =If(IsBlank(Topic.FromPhoneNumber), Topic.FromPhoneNumber, Concat(Split(Topic.FromPhoneNumber, ""), If(IsNumeric(Value), Value, "")))

          - kind: SetVariable
            id: yyqUKa
            displayName: Set selected phone number
            variable: Topic.selectedPhoneNumber
            value: =First(Filter(Topic.transformedTable, phoneNumber = TrimEnds( Topic.FromPhoneNumber)))

          - kind: SetVariable
            id: V7BbNE
            displayName: Set new phone no country code
            variable: Topic.toPhoneCountryCode
            value: =If(IsBlank(Topic.ToPhoneNumber), "", If(IsBlank(Find("+", Topic.ToPhoneNumber)), "", Mid(Topic.ToPhoneNumber, Find("+", Topic.ToPhoneNumber), Find(" ", Topic.ToPhoneNumber))))

          - kind: SetVariable
            id: TH0jZp
            displayName: Remove country code from toPhone
            variable: Topic.ToPhoneNumber
            value: =If(IsBlank(Topic.ToPhoneNumber), "", If(IsBlank(Find("+", Topic.ToPhoneNumber)), TrimEnds(Topic.ToPhoneNumber), If(IsBlank(Find(" ", Topic.ToPhoneNumber)), TrimEnds(Topic.ToPhoneNumber), Mid(Topic.ToPhoneNumber, Find(" ", TrimEnds(Topic.ToPhoneNumber))))))

          - kind: SetVariable
            id: setVariable_6nNB0m
            displayName: Set phone number count
            variable: Topic.countOfPhoneNumbers
            value: =CountRows(Topic.tableWorkdayResponse.PhoneInformationData)

          - kind: ConditionGroup
            id: conditionGroup_V5m2uP
            conditions:
              - id: conditionItem_tttNWC
                condition: =Topic.countOfPhoneNumbers > 0 && IsBlank(Topic.selectedPhoneNumber)
                displayName: Has any phone numbers?
                actions:
                  - kind: AdaptiveCardPrompt
                    id: TrCiWm
                    displayName: Display phone numbers to select
                    card: |-
                      ={
                        '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                        type: "AdaptiveCard",
                        version: "1.3",
                        body: [
                          {
                            type: "TextBlock",
                            text: "Select Phone Number",
                            weight: "Bolder",
                            size: "Medium",
                            wrap: true,
                            color: "Accent"
                          },
                          {
                            type: "TextBlock",
                            wrap: true,
                            text: "Please select the phone number you would like to update."
                          },
                          {
                            type: "TextBlock",
                            wrap: true,
                            text: "Alternatively, if you want to add new phone number, select Add new."
                          },
                          {
                            type: "Input.ChoiceSet",
                            id: "choiceSelectPhoneNo",
                            label: "Select Phone Number",
                            value: First(Filter(Topic.transformedTable, isPrimary = true)).phoneReference,
                            choices: ForAll(SortByColumns(Topic.transformedTable, "isPrimary", SortOrder.Descending), {title: Concatenate( ThisRecord.deviceType, " ", ThisRecord.displayPhoneNumber, If(ThisRecord.isPrimary, " (Primary)", "")) , value: ThisRecord.phoneReference})
                          }
                        ],
                        actions: [
                          {
                            type: "Action.Submit",
                            title: "Update",
                            data: {
                              action: "Update"
                            }
                          },
                          {
                            type: "Action.Submit",
                            title: "Add New",
                            data: {
                              action: "New"
                            }
                          },
                          {
                            type: "Action.Submit",
                            title: "Cancel",
                            data: {
                              action: "Cancel"
                            }
                          }
                        ]
                      }
                    output:
                      binding:
                        action: Topic.action
                        actionSubmitId: Topic.actionSubmitId
                        choiceSelectPhoneNo: Topic.choiceSelectPhoneNo

                    outputType:
                      properties:
                        action: String
                        actionSubmitId: String
                        choiceSelectPhoneNo: String

                  - kind: ConditionGroup
                    id: conditionGroup_dQzdX4
                    conditions:
                      - id: conditionItem_ZiCdgi
                        condition: =Topic.actionSubmitId = "Update"
                        actions:
                          - kind: SetVariable
                            id: 5jDXIh
                            displayName: Set flag that user is updating
                            variable: Topic.userChoseUpdateOption
                            value: =Boolean(true)

                          - kind: SetVariable
                            id: CL7hoP
                            displayName: Set selected phone number
                            variable: Topic.selectedPhoneNumber
                            value: =First(Filter(Topic.transformedTable, phoneReference = Topic.choiceSelectPhoneNo))

                      - id: conditionItem_yQ8Qiu
                        condition: =Topic.actionSubmitId = "Add New"
                        actions:
                          - kind: SetVariable
                            id: w9i5Lu
                            displayName: Set flag that user is updating
                            variable: Topic.userChoseUpdateOption
                            value: =Boolean(false)

                    elseActions:
                      - kind: SendActivity
                        id: sendActivity_O1MdwM
                        activity: The update to your phone number has been canceled. Is there anything else you need help with?

                      - kind: CancelAllDialogs
                        id: 8Z7Atm

              - id: conditionItem_b00wlb
                condition: =!IsBlank(Topic.selectedPhoneNumber)
                actions:
                  - kind: SetVariable
                    id: ieEWiK
                    displayName: Set flag that user is updating
                    variable: Topic.userChoseUpdateOption
                    value: =Boolean(true)

          - kind: ConditionGroup
            id: conditionGroup_1s8hl5
            conditions:
              - id: conditionItem_iYN8fX
                condition: =IsBlank(Global.CountryCodeLookupTable)
                displayName: If country code picklist is uninitialized
                actions:
                  - kind: BeginDialog
                    id: DNk6LX
                    displayName: Redirect to Workday System Get Reference Data
                    input:
                      binding:
                        referenceDataKey: Country_Phone_Code_ID

                    dialog: gptagent_copilotforemployeeselfserviceit.topic.GetReferenceData

          - kind: ConditionGroup
            id: conditionGroup_owP3cD
            conditions:
              - id: conditionItem_z0rOtL
                condition: =IsBlank(Global.PhoneDeviceTypesLookupTable)
                displayName: If device picklist is uninitialized
                actions:
                  - kind: BeginDialog
                    id: IY5ZrN
                    displayName: Redirect to Workday System Get Reference Data
                    input:
                      binding:
                        referenceDataKey: Phone_Device_Type_ID

                    dialog: gptagent_copilotforemployeeselfserviceit.topic.GetReferenceData

          - kind: AdaptiveCardPrompt
            id: gqG9nJ
            displayName: Show phone number input card
            card: |-
              ={
                  type: "AdaptiveCard",
                  '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                  version: "1.3",
                  body: [
                    {
                      type: "TextBlock",
                      text:  If(Topic.userChoseUpdateOption, "Update Phone Number", "Add Phone Number"),
                      weight: "Bolder",
                      size: "Medium",
                      wrap: true,
                      color: "Accent"
                    },
                    {
                      type: "TextBlock",
                      text: If(Topic.userChoseUpdateOption, Concatenate("Sure, to update the phone number ", Topic.selectedPhoneNumber.phoneNumber, ", fill out the fields below."), "Sure, to add a new phone number fill out the fields below."),
                      wrap: true
                    },
                    {
                      type: "ColumnSet",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [
                            {
                              type: "Input.ChoiceSet",
                              id: "deviceType",
                              placeholder: "Select Device Type",
                              label: "Device Type",
                              choices: ForAll(Global.PhoneDeviceTypesLookupTable, { title: ThisRecord.ID, value: ThisRecord.ID}),
                              value: If(IsBlank(Topic.selectedPhoneNumber),"Mobile", Topic.selectedPhoneNumber.deviceType),
                              isRequired: true,
                              errorMessage: "Input Required"
                            },
                            {
                              type: "Input.ChoiceSet",
                              id: "countryCode",
                              placeholder: "Select Country Code",
                              label: "Country Code",
                              choices: ForAll(Global.CountryCodeLookupTable, { title: ThisRecord.Referenced_Object_Descriptor, value: ThisRecord.ID}),
                              value: If(IsBlank(Topic.toPhoneCountryCode), If(IsBlank(Topic.selectedPhoneNumber),First(Global.CountryCodeLookupTable).ID, Topic.selectedPhoneNumber.countryCodeId), First(Search(Global.CountryCodeLookupTable, TrimEnds(Topic.toPhoneCountryCode), Referenced_Object_Descriptor)).ID),
                              isRequired: true,
                              errorMessage: "Input Required"
                            },
                            {
                              type: "Input.Text",
                              id: "phoneNumber",
                              placeholder: "Phone Number",
                              label: "Phone Number",
                              maxLength: 20,
                              isRequired: true,			  value: If(IsBlank(Topic.ToPhoneNumber), If(IsBlank(Topic.selectedPhoneNumber), "", Topic.selectedPhoneNumber.phoneNumber), TrimEnds(Topic.ToPhoneNumber)),			  errorMessage: "Input Required"


                            },
                            {
                              type: "Input.ChoiceSet",
                              id: "isPrimary",
                              label: "Is this your primary phone number?",
                              placeholder: "Is this your primary phone number?",
                              choices: [
                                {
                                  title: "No",
                                  value: "false"
                                },
                                {
                                  title: "Yes",
                                  value: "true"
                                }
                              ],
                              value: If(IsBlank(Topic.selectedPhoneNumber), If(Topic.countOfPhoneNumbers = 0, "true", "false"), Topic.selectedPhoneNumber.isPrimary),
                              isVisible: (Not(IsBlank(Topic.selectedPhoneNumber) || Topic.selectedPhoneNumber.isPrimary)) || Topic.userChoseUpdateOption = false,
                              isRequired: true,
                              errorMessage: "Input Required"
                            },
                            {
                              type: "TextBlock",
                              text: "Is this your primary phone number?",
                              wrap: true,
                              isVisible:  (Topic.userChoseUpdateOption && Topic.selectedPhoneNumber.isPrimary) || (Topic.countOfPhoneNumbers = 0)
                            },
                            {
                              type: "TextBlock",
                              text: "Yes",
                              wrap: true,
                              isVisible:  (Topic.userChoseUpdateOption && Topic.selectedPhoneNumber.isPrimary) || (Topic.countOfPhoneNumbers = 0)
                            }
                          ]
                        }
                      ]
                    }
                  ],
                  actions: [
