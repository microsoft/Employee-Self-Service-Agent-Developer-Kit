                        state: Topic.State

                    outputType:
                      properties:
                        actionSubmitId:
                          type: String
                          examples:

                        comment:
                          type: String
                          examples:

                        state:
                          type: String
                          examples:

                  - kind: ConditionGroup
                    id: conditionGroup_9qTuJB
                    conditions:
                      - id: conditionItem_RN14x6
                        condition: =Topic.actionSubmitId = "Cancel"
                        displayName: User clicked on cancel?
                        actions:
                          - kind: AdaptiveCardPrompt
                            id: TDsyBI
