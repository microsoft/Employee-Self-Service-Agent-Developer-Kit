      createdTimeUtc: 2026-09-07T00:00:00.0000000Z
      modifiedTimeUtc: 2026-09-07T00:00:00.0000000Z
      createdBy: b43923a9-9f93-482f-939e-6461def6d786
      modifiedBy: b43923a9-9f93-482f-939e-6461def6d786

    displayName: "Workday Update Email"
    id: 0414dcce-f709-5cbe-a4aa-21e5200b671b
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.Workdayemployeeupdateemail
    dialog:
      useVerbatimOutputMessages: true
      inputs:
        - kind: AutomaticTaskInput
          propertyName: EmailUpdateFrom
          description: Email address to update from
          entity: EmailPrebuiltEntity
          shouldPromptUser: false

        - kind: AutomaticTaskInput
          propertyName: EmailupdateTo
          description: Email address to update to
          entity: EmailPrebuiltEntity
          shouldPromptUser: false

      modelDescription: |-
        This tool updates the email address of the user making the request
        through Workday. ALWAYS invoke this tool when the user expresses
        intent to update, change, add, remove, or modify their email address,
        even if they do not provide a specific email address. The tool will
        prompt the user for any missing information through an interactive form.

        When to invoke:
        - "Update my email address"
        - "I want to update my email address"
        - "I want to change my email"
        - "I need to add a new email address"
        - "I need to update my email from [EmailUpdateFrom] to [EmailupdateTo]"
        - "I need to add my email [EmailupdateTo]"
        - Any variation of requesting an email address update for themselves

        Do NOT invoke for:
        - Requests about other people's email addresses
        - General questions about email policies
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - "Update my personal email in Workday."
        actions:
          - kind: ConditionGroup
            id: ensureWorkdayContext
            conditions:
              - id: ensureWorkdayContextWhenMissing
                condition: =IsBlank(Global.ESS_UserContext_Employee_Id) || Global.ESS_UserContext_Employee_Id = """"""
