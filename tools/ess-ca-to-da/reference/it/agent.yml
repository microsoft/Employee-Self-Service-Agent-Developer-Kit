                                      },
                                      {
                                        title: "Yes",
                                        value: "true"
                                      }
                                    ],
                                    value: "true",
                                    isVisible: Not(Topic.AddFirstEmail),
                                    isRequired: true,
                                    errorMessage: "Input Required"
                                  },
                                  {
                                    type: "TextBlock",
                                    text: "Is this your primary email address?",
