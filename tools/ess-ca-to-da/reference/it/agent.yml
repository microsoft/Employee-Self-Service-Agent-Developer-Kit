                              ),
                              ExpirationDate: currentRecord.Expiration_Date,
                              IDType: Coalesce(
                                  LookUp(Global.NationalIdTypeLookupTable, ID = nationalIdTypeKey).Referenced_Object_Descriptor,
                                  nationalIdTypeKey
                              ),
                              IssuedDate: currentRecord.Issued_Date,
                              ID: If(IsBlank(currentRecord.ID), Blank(), If(Len(currentRecord.ID) > 4, "****" & Right(currentRecord.ID, 4), "****"))
                          }
                      )
                  )
              )

          - kind: ConditionGroup
            id: conditionGroup_PLj70M
            conditions:
              - id: conditionItem_TCBTE7
                condition: =IsBlank(Topic.finalizedResponseTableData)
                actions:
                  - kind: SendActivity
                    id: sendActivity_jPX7sn
                    activity: There are no national IDs listed for you in the system. If this information should be included, you can update it directly in Workday or reach out to HR for assistance.

            elseActions:
