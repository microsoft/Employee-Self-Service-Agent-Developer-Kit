    displayName: "Workday Get ServiceAnniversary"
    id: 8c921aa6-3b3b-5943-85eb-e4b2586952ec
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.Workdayserviceanniversary
    dialog:
      useVerbatimOutputMessages: true
      inputs:
        - kind: AutomaticTaskInput
          propertyName: serviceAnniversaryDuration
          description: Get service anniversary duration as year number from user prompt.
          entity: NumberPrebuiltEntity
          shouldPromptUser: false
          inputSettings:
            repeatCount: 0
            validation: =Topic.serviceAnniversaryDuration <= 25
            defaultValue: =Blank()

      modelDescription: |-
        Use this topic when the user asks about THEIR OWN service anniversary, work anniversary, employment anniversary, tenure milestone, years of service, hire anniversary, or
        milestone year (e.g., 1 year, 5 year, 10 year anniversary date). Data is retrieved from Workday and belongs exclusively to the requesting user.

        Valid: "What is my service anniversary?", "When is my 5 year work anniversary?", "What's the date of my next milestone anniversary?", "When did I complete X years at the
        company?"

        Output rules:
        - Must be human-readable and cleanly formatted
        - Use ONLY values from {Topic.anniversaryResponse}
        - Use {Topic.identifiedAnniversary} to pick the correct year from {Topic.anniversaryResponse}
        - Format: "Your <N> year service anniversary is on <date>"
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - "When is my service anniversary?"
        actions:
          - kind: ConditionGroup
            id: ensureWorkdayContext
            conditions:
              - id: ensureWorkdayContextWhenMissing
                condition: =IsBlank(Global.ESS_UserContext_Employee_Id) || Global.ESS_UserContext_Employee_Id = """"""
                displayName: Initialize Workday user context when needed
                actions:
                  - kind: BeginDialog
                    id: callWorkdayUserContext
                    displayName: Retrieve the current Workday user context
                    dialog: gptagent_copilotforemployeeselfserviceit.topic.WorkdaySystemGetUserContextV2

          - kind: ParseValue
            id: puT3wh
            displayName: Set serviceAnniversaryDuration
            variable: Topic.serviceAnniversaryDuration
            valueType: Number
            value: =If(IsBlankOrError(Topic.serviceAnniversaryDuration),1,Topic.serviceAnniversaryDuration)

          - kind: BeginDialog
            id: PnOsQI
            displayName: Redirect to Workday Get Common Execution
            input:
              binding:
                parameters: ="{""params"":" & JSON(Table({key:"{Employee_ID}", value:Coalesce(Global.ESS_UserContext_Employee_Id, "")},{key:"{As_Of_Effective_Date}", value:Text(Today(), "yyyy-MM-dd")})) & "}"
                scenarioName: msdyn_WorkdayHCMRuntimeEmployeeGetServiceAnniversary

            dialog: gptagent_copilotforemployeeselfserviceit.topic.WorkdaySystemGetCommonExecution
            output:
              binding:
                errorResponse: Topic.errorResponse
                isSuccess: Topic.isSuccess
                workdayResponse: Topic.workdayResponse

          - kind: ParseValue
            id: UYbI2F
            displayName: Parse workdayResponse
            variable: Topic.parsedWorkdayResponse
            valueType:
              kind: Record
              properties:
                HireDate:
                  type:
                    kind: Table
                    properties:
                      Value: String

            value: =Topic.workdayResponse

          - kind: SetVariable
            id: setVariable_PVmy3i
            displayName: Parse hireDate from workdayResponse
            variable: Topic.hireDate
            value: =DateValue(Text(First(Topic.parsedWorkdayResponse.HireDate).Value))

          - kind: SetVariable
            id: setVariable_7je5pM
            displayName: Calculate next anniversary date
            variable: Topic.nextAnniversary
            value: |-
              =If(
                        Today() <= DateAdd(Topic.hireDate, DateDiff(Topic.hireDate, Today(), TimeUnit.Years), TimeUnit.Years),
                        DateAdd(Topic.hireDate, DateDiff(Topic.hireDate, Today(), TimeUnit.Years), TimeUnit.Years),
                        DateAdd(Topic.hireDate, DateDiff(Topic.hireDate, Today(), TimeUnit.Years) + 1, TimeUnit.Years)
                      )

          - kind: SetVariable
            id: setVariable_PRRRye
            displayName: Calculate identified anniversary date
            variable: Topic.identifiedAnniversary
            value: =DateDiff(Topic.hireDate, Topic.nextAnniversary, TimeUnit.Years)

          - kind: SetVariable
            id: setVariable_3qvk7L
            displayName: "Set Response Record "
            variable: Topic.anniversaryResponse
            value: |-
              ={
                  EmployeeName: Global.ESS_UserContext_Employee_Firstname & " " & Global.ESS_UserContext_Employee_Lastname,
                  EmployeeJoinDate: DateValue(Topic.hireDate),
                  duration: Topic.serviceAnniversaryDuration,
                  nextAnniversary: Topic.nextAnniversary,
                  identifiedAnniversary: Topic.identifiedAnniversary,
                  description: Text(First(ParseJSON(Topic.workdayResponse)).description)
              }

          - kind: SendActivity
            id: sendActivity_yJow4L
            activity: |-
              Here is your service anniversary details:
              {Topic.anniversaryResponse}

      inputType:
        properties:
          serviceAnniversaryDuration:
            displayName: serviceAnniversaryDuration
            description: Get service anniversary duration as year number from user prompt.
            type: Number

      outputType:
        properties:
          anniversaryResponse:
            displayName: anniversaryResponse
            type:
              kind: Record
              properties:
                description: String
                duration: Number
                EmployeeJoinDate: Date
                EmployeeName: String
                identifiedAnniversary: Number
                nextAnniversary: Date

