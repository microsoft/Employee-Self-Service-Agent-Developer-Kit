                    action: Topic.action
                    actionSubmitId: Topic.actionSubmitId
                    choiceSelectEmailAddress: Topic.choiceSelectEmailAddress

                outputType:
                  properties:
                    action: String
                    actionSubmitId: String
                    choiceSelectEmailAddress: String

              - kind: SetVariable
                id: setVariable_R94mfx
                variable: Topic.AddFirstEmail
                value: =false

          - kind: ConditionGroup
