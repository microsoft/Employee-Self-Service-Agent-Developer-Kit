    displayName: Workday Get EmployeeId
    id: fa88d3df-617c-562a-b1a3-777234d5e8f1
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.WorkdayEmployeeID
    dialog:
      modelDescription: |-
        Use this topic when the signed-in user asks for their own employee ID or employee number stored in Workday. The data belongs exclusively to the requesting user. Do not answer questions about another person’s employee ID.

        Valid requests include: "What is my employee ID?", "Tell me my employee number", and "What is my emp ID?"
      useVerbatimOutputMessages: true
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - What is my employee ID?
            - Tell me my employee number
            - What is my emp ID?

        actions:
          - kind: InvokeFlowAction
            id: invokeEmployeeInformationRuntime
            displayName: Call Workday employee-information runtime
            input:
              binding:
                text: ="{""params"":" & JSON(Table({key:"{As_Of_Effective_Date}", value:Text(Today(), "yyyy-MM-dd")})) & "}"
                text_1: msdyn_WorkdayHCMRuntimeEmployeeGetInformation

            output:
              binding:
                errorresponse: Topic.errorResponse
                issuccess: Topic.isSuccess
                workdayresponse: Topic.workdayResponse

            flowId: 3164dae9-3a2b-5843-98dd-e62bb5123324

          - kind: ConditionGroup
            id: conditionGroup_employeeInformationFailed
            conditions:
              - id: conditionItem_employeeInformationFailed
                condition: =Topic.isSuccess = false
                displayName: Workday employee-information request failed
                actions:
                  - kind: SendActivity
                    id: sendEmployeeInformationFailure
                    activity: I couldn’t retrieve your employee ID from Workday. Start a new conversation and try again. If the problem continues, contact your administrator.

                  - kind: CancelAllDialogs
                    id: cancelEmployeeInformationFailure

          - kind: ParseValue
            id: parseEmployeeInformation
            displayName: Parse Workday employee information
            variable: Topic.employeeRecord
            valueType:
              kind: Record
              properties:
                Employee_ID:
                  type:
                    kind: Table
                    properties:
                      Value: String

            value: =Topic.workdayResponse

          - kind: ConditionGroup
            id: conditionGroup_employeeIdMissing
            conditions:
              - id: conditionItem_employeeIdMissing
                condition: =IsBlankOrError(Topic.employeeRecord.Employee_ID)
                displayName: Workday did not return an employee ID
                actions:
                  - kind: SendActivity
                    id: sendEmployeeIdMissing
                    activity: Workday did not return an employee ID for your account. If you expected one to be assigned, contact your HR or People team.

                  - kind: CancelAllDialogs
                    id: cancelEmployeeIdMissing

          - kind: SetVariable
            id: setEmployeeIdOutput
            displayName: Set employee ID output
            variable: Topic.EmployeeIdData
            value: |-
              ={
                  EmployeeId: First(Topic.employeeRecord.Employee_ID).Value
              }

          - kind: SendActivity
            id: sendEmployeeId
            activity: Your Employee ID is {Topic.EmployeeIdData.EmployeeId}.

      outputType:
        properties:
          EmployeeIdData:
            displayName: EmployeeIdData
            type:
              kind: Record
              properties:
                EmployeeId: String

