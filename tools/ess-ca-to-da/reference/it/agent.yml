                workdayResponse: Topic.workdayResponse

          - kind: ParseValue
            id: v0OBu2
            displayName: Parse workdayResponse into table
            variable: Topic.parsedWorkdayResponse
            valueType:
              kind: Record
              properties:
                NationalId:
                  type:
                    kind: Table
                    properties:
                      Country_Reference:
                        type:
                          kind: Record
                          properties:
                            ID:
                              type:
                                kind: Table
                                properties:
                                  "@type": String
                                  "#text": String

                      Expiration_Date: String
                      ID: String
                      ID_Type_Reference:
                        type:
                          kind: Record
                          properties:
                            ID:
                              type:
                                kind: Table
                                properties:
                                  "@type": String
                                  "#text": String

                      Issued_Date: String

            value: =Topic.workdayResponse

          - kind: BeginDialog
            id: 5OnQyu
            displayName: Refresh country name reference data
            input:
              binding:
                IsTableEmpty: =IsBlank(Global.CountryNameLookupTable)
                ReferenceDataKey: ISO_3166-1_Alpha-2_Code

            dialog: gptagent_copilotforemployeeselfserviceit.topic.WorkdaySystemRefreshReferenceData

          - kind: BeginDialog
            id: 3rbRnP
            displayName: Refresh national ID type reference data
            input:
              binding:
                IsTableEmpty: =IsBlank(Global.NationalIdTypeLookupTable)
                ReferenceDataKey: National_ID_Type_Code

            dialog: gptagent_copilotforemployeeselfserviceit.topic.WorkdaySystemRefreshReferenceData

          - kind: SetVariable
            id: setVariable_3aVFKc
            displayName: Add columns from the lookup tables
            variable: Topic.finalizedResponseTableData
            value: |
              =ForAll(
                  Topic.parsedWorkdayResponse.NationalId,
                  With(
                      {currentRecord: ThisRecord},
                      With(
                          {
                              countryKey: LookUp(
                                  currentRecord.Country_Reference.ID,
                                  '@type' = First(Global.CountryNameLookupTable).Reference_ID_Type
                              ).'#text',
                              nationalIdTypeKey: LookUp(
                                  currentRecord.ID_Type_Reference.ID,
                                  '@type' = First(Global.NationalIdTypeLookupTable).Reference_ID_Type
                              ).'#text'
                          },
                          {
                              EmployeeName: Global.ESS_UserContext_Employee_Firstname & " " & Global.ESS_UserContext_Employee_Lastname,
