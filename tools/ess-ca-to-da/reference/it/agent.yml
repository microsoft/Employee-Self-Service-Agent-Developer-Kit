    displayName: ESS DAIT ServiceNow ITSM Get User Tickets
    id: 079c4aab-eee2-5ad2-872f-185f50e2ed7f
    parentBotId: 00000000-0000-0000-0000-000000000000
    description: ESS DAIT ServiceNow ITSM Get User Tickets
    shareContext: {}
    state: Active
    status: Active
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.ServiceNowITSMGetUserTickets
    dialog:
      inputs:
        - kind: AutomaticTaskInput
          propertyName: TicketState
          description: |-
            TicketState indicates the state of the tickets the user wants to fetch. For active, open and **resolved** tickets, TicketState value will be 'active'. Only for closed tickets, TicketState value will be 'inactive'. If not sure of the state or if user is requesting all the tickets, TicketState will be 'all'.
            Examples 
            query - "List of my new tickets"; TicketState value - "active"
            query - "List of my resolved tickets"; TicketState value - "active"
            query - "List of my tickets"; TicketState - "all"
            query - "List of my closed tickets"; TicketState value - "inactive"
          entity: StringPrebuiltEntity
          shouldPromptUser: false

      modelDescription: |-
        Use this topic when the user asks to LIST or RETRIEVE THEIR OWN IT support / IT helpdesk / IT incident tickets in ServiceNow — open, active, in-progress, new, pending, on hold, resolved, closed, or completed. Includes tickets reported BY the user or ON BEHALF of the user.

        Triggers:
        - "List of my support tickets"
        - "My open / active / closed tickets"
        - "Get my IT tickets"
        - "Fetch my tickets"
        - "Get [closed] tickets related to <issue>"
        - "Show all my INC tickets"

        Response:
        1. Present the ticket list below exactly as provided — do not modify, reorder, renumber, or rebuild the links.
        2. If no tickets are found, inform the user.
        3. If tickets are found, mention they're sorted by most recently updated.
        4. Render each ticket line exactly as provided — keep the markdown link intact; never convert it to a bare URL, and do not add your own numbering:
        **[{Number}]({ServiceNowPortalBaseURI}?id=ticket&table=incident&sys_id={SysId})**: {Short Description} ({Status})
        5. Offer to update a ticket or fetch more details.

      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent: {}
        actions:
          - kind: ConditionGroup
            id: conditionGroup_YsYEcq
            conditions:
              - id: conditionItem_L6VKux
                condition: =!IsBlank(Global.ESS_ServiceNow_AllTickets) && !IsBlank(Global.ESS_ServiceNow_NextAllTicketsRefresh) && Global.ESS_ServiceNow_NextAllTicketsRefresh > Now()
                displayName: Condition - Tickets List is Cached?
                actions:
                  - kind: SetVariable
                    id: setVariable_Spgwqz
                    variable: Topic.ServiceNowData
                    value: =Global.ESS_ServiceNow_AllTickets

              - id: conditionItem_5HLaZH
                condition: =Topic.TicketState = "all" || IsBlank(Topic.TicketState)
                displayName: Condition - List of All Tickets
                actions:
                  - kind: BeginDialog
                    id: iTTFpx
                    input:
                      binding:
                        InputParameters: ="[]"
                        IsActive: =Blank()
                        UserIdentifier: =Global.ESS_UserContext_UPN

                    dialog: gptagent_copilotforemployeeselfserviceit.topic.ServiceNowITSMSystemGetTicketsList
                    output:
                      binding:
                        ServiceNowData: Topic.ServiceNowData

            elseActions:
              - kind: SetVariable
                id: setVariable_6yiOni
                variable: Topic.IsActive
                value: =If(Topic.TicketState = "active", true, false)

              - kind: BeginDialog
                id: gLkwe8
                input:
                  binding:
                    InputParameters: |-
                      =JSON
                      (
                        Table
                        (
                          {
                            Name: "IsActive",
                            Value: Text(Topic.IsActive)
                          }
                        )
                      )
                    IsActive: =Topic.IsActive
                    UserIdentifier: =Global.ESS_UserContext_UPN

                dialog: gptagent_copilotforemployeeselfserviceit.topic.ServiceNowITSMSystemGetTicketsList
                output:
                  binding:
                    ServiceNowData: Topic.ServiceNowData

          - kind: SetVariable
            id: setVariable_buildTicketsMarkdown
            variable: Topic.TicketsMarkdown
            value: |-
              =IfError(
                  With(
                      {
                          TicketLines: Concat(
                              ForAll(
                                  ParseJSON(Topic.ServiceNowData) As Ticket,
                                  If(
                                      IsBlank(Ticket.ServiceNowPortalBaseURI),
                                      "**" & Text(Ticket.TicketNumber) & "**: " & Text(Ticket.ShortDescription) & " (" & Text(Ticket.State) & ")",
                                      "**[" & Text(Ticket.TicketNumber) & "](" & Text(Ticket.ServiceNowPortalBaseURI) & "?id=ticket&table=incident&sys_id=" & EncodeUrl(Text(Ticket.SysId)) & ")**: " & Text(Ticket.ShortDescription) & " (" & Text(Ticket.State) & ")"
                                  )
                              ),
                              Value,
                              Char(10)
                          )
                      },
                      If(IsBlank(TicketLines), "", TicketLines)
                  ),
                  ""
              )

          - kind: SetVariable
            id: setVariable_ticketsLoadError
            variable: Topic.TicketsLoadError
            value: =!IsBlank(Topic.ServiceNowData) && IsError(ParseJSON(Topic.ServiceNowData))

          - kind: ConditionGroup
            id: conditionGroup_emitTicketsList
            conditions:
              - id: conditionItem_loadError
                condition: =Topic.TicketsLoadError
                actions:
                  - kind: SendActivity
                    id: sendActivity_ticketsError
                    activity: Sorry, I couldn't load your tickets right now. Please try again in a moment.

              - id: conditionItem_hasTickets
                condition: =!IsBlank(Topic.TicketsMarkdown)
                actions:
                  - kind: SendActivity
                    id: sendActivity_emitTicketsList
                    activity: "{Topic.TicketsMarkdown}"

            elseActions:
              - kind: SendActivity
                id: sendActivity_noTickets
                activity: You don't have any IT tickets matching that request.

      inputType:
        properties:
          TicketState:
            displayName: TicketState
            description: |-
              TicketState indicates the state of the tickets the user wants to fetch. For active, open and **resolved** tickets, TicketState value will be 'active'. Only for closed tickets, TicketState value will be 'inactive'. If not sure of the state or if user is requesting all the tickets, TicketState will be 'all'.
              Examples 
              query - "List of my new tickets"; TicketState value - "active"
              query - "List of my resolved tickets"; TicketState value - "active"
              query - "List of my tickets"; TicketState - "all"
              query - "List of my closed tickets"; TicketState value - "inactive"
            type: String
            examples:

      outputType:
        properties:
          ServiceNowData:
            displayName: ServiceNowData
            description: List of Tickets data returned from ServiceNow.
            type: String
            examples:

