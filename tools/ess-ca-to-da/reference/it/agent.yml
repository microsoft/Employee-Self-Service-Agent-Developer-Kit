                    id: 30gNqe
                    input:
                      binding:
                        SysId: =Topic.Details.SysId

                    dialog: gptagent_copilotforemployeeselfserviceit.topic.ServiceNowITSMSystemGetTicketDetails
                    output:
                      binding:
                        ServiceNowData: Topic.ServiceNowData

                  - kind: ParseValue
                    id: KjF1kJ
                    variable: Topic.TicketDetailsList
                    valueType:
                      kind: Table
                      properties:
                        AssignedTo:
                          type: String
                          examples:

                        CallerIdSystemLink:
                          type: String
                          examples:

                        Category:
                          type: String
                          examples:

                        Comments:
                          type: String
                          examples:

                        Description:
                          type: String
                          examples:

                        LastUpdated:
                          type: String
                          examples:

                        ServiceNowPortalBaseURI:
                          type: String
                          examples:

                        Severity:
                          type: String
                          examples:

                        ShortDescription:
                          type: String
                          examples:

                        State:
                          type: String
                          examples:

                        SysId:
                          type: String
                          examples:

                        TicketNumber:
                          type: String
                          examples:

                    value: =Topic.ServiceNowData

                  - kind: SetVariable
                    id: selectFirstTicketDetails
                    variable: Topic.TicketDetails
                    value: =First(Topic.TicketDetailsList)

                  - kind: SetVariable
                    id: setVariable_sxJvE8
                    variable: Topic.FirstComment
                    value: =First(Split(Topic.TicketDetails.Comments, Char(10) & Char(10))).Value

                  - kind: SetTextVariable
                    id: setVariable_1TvEFy
                    variable: Topic.ITCaseTitle
                    value: "IT Support Ticket #{Topic.TicketDetails.TicketNumber} | "

                  - kind: SetVariable
                    id: setVariable_buildTicketLink
                    variable: Topic.TicketLinkMarkdown
                    value: |-
                      ="[" & Text(Topic.TicketDetails.TicketNumber) & "](" & Text(Topic.TicketDetails.ServiceNowPortalBaseURI) & "?id=ticket&table=incident&sys_id=" & Text(Topic.TicketDetails.SysId) & ")"

                  - kind: ConditionGroup
                    id: conditionGroup_emitTicketLink
                    conditions:
                      - id: conditionItem_hasTicketLink
                        condition: =!IsBlank(Topic.TicketDetails.ServiceNowPortalBaseURI) && !IsBlank(Topic.TicketDetails.TicketNumber) && !IsBlank(Topic.TicketDetails.SysId)
                        actions:
                          - kind: SendActivity
                            id: sendActivity_emitTicketLink
                            activity: "{Topic.TicketLinkMarkdown}"

                  - kind: SendActivity
                    id: sendActivity_ly3T2X
                    activity:
                      text:
                        - You can view the ticket details below.
                      attachments:
                        - kind: AdaptiveCardTemplate
                          cardContent: |-
                            ={
                              type: "AdaptiveCard",
                              '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                              version: "1.3",
                              body: [
                                {
                                  type: "Container",
