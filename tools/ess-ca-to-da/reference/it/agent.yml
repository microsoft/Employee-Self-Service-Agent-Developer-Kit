    displayName: "[Example] - Sensitive Topics"
    id: 26c7cb9d-ba76-4294-9a2b-96cc08f31067
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.SensitiveTopics
    dialog:
      modelDescription: |-
        **This topic should only trigger** for explicitly sensitive, confidential, or legal workplace concerns: harassment or unfair treatment, abuse, discrimination or bias, unethical behavior, retaliation, bullying, supervisor abuse of power, boundary crossing, hostile work environments, workplace violence, severe misconduct, privacy or legal concerns, HR consultation on sensitive matters, complaints, rights or investigation concerns, unsafe situations, or any self-harm or suicidal intent.

        **It must not** trigger for routine IT or HR inquiries: informational, policy, or rights questions that only mention a sensitive term (e.g. "what is our harassment policy") or its causes, impact, or prevention; IT support, access, or device/account issues; security or suspicious-activity reports; benefits; routine or performance questions; or other non-sensitive matters.
      useVerbatimOutputMessages: true
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          triggerQueries:
            - sensitive topics
            - discuss sensitive subjects
            - talk about touchy issues
            - address controversial matters
            - engage in difficult conversations
            - explore delicate topics
            - open up about sensitive subjects
            - navigate challenging discussions
            - illegal topics
            - I'm suicidal
            - I want to end my life
            - I want to hurt myself

        actions:
          - kind: SendActivity
            id: sendActivity_85pmxq
            activity: Consulting with a professional is the best way to get assistance with this request. Please contact a representative for further support.

          - kind: CancelAllDialogs
            id: AVN4jX

