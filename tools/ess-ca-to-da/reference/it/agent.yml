      - displayName: Get Knowledge Article
        description: Returns the full content of a single knowledge base (KB) article, including template/Knowledge-Block section content that is not returned by the Get Knowledge Articles search endpoint.
        inputType:
          properties:
            articleSysId:
              displayName: Article Sys ID
              description: The sys_id or KB number of the knowledge article to retrieve.
              isRequired: true
              order: 0
              type: String

            fields:
              displayName: Fields
              description: Comma-separated list of fields from the Knowledge table to return.
              visibility: Advanced
              order: 1
              type: String

            language:
              displayName: Language
              description: Comma-separated list of languages of the KB article to return.
              visibility: Advanced
              order: 2
              type: String

        outputType:
          kind: Record
          properties:
            result:
              displayName: Result
              description: The requested knowledge article.
              order: 0
              type:
                kind: Record
                properties:
                  content:
                    displayName: Content
                    description: The assembled template sections for template/Knowledge-Block articles.
                    order: 7
                    type:
                      kind: Table
                      properties:
                        column:
                          displayName: Column
                          description: The template column backing the section.
                          order: 1
                          type: String

                        content:
                          displayName: Content
                          description: The section body.
                          order: 3
                          type: String

                        label:
                          displayName: Label
                          description: The display label of the template section.
                          order: 0
                          type: String

                        type:
                          displayName: Type
                          description: The content type of the section (for example html).
                          order: 2
                          type: String

                  language:
                    displayName: Language
                    description: The language of the returned article.
                    order: 6
                    type: String

                  number:
                    displayName: Number
                    description: The KB number of the article.
                    order: 0
                    type: String

                  short_description:
                    displayName: Short Description
                    description: The short description (title) of the article.
                    order: 2
                    type: String

                  sys_id:
                    displayName: Sys ID
                    description: The sys_id of the article.
                    order: 1
                    type: String

                  template:
                    displayName: Template
                    description: True when the article is a template/Knowledge-Block article whose body is returned under content.
                    order: 4
                    type: Boolean

                  template_table:
                    displayName: Template Table
                    description: The template table backing a template article (for example kb_template_how_to).
                    order: 5
                    type: String

                  text:
                    displayName: Text
                    description: The body of standard body-field articles. Empty for template/Knowledge-Block articles, whose body is returned under content.
                    order: 3
                    type: String

        operationId: GetKnowledgeArticle

