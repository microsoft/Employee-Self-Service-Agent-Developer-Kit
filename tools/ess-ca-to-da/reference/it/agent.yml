                deviceType: String
                isPrimary: String
                phoneNumber: String

          - kind: ConditionGroup
            id: conditionGroup_79KQkA
            conditions:
              - id: conditionItem_NESGkg
                condition: =Topic.actionSubmitId = "Submit"
                displayName: Submit is pressed
                actions:
                  - kind: SetVariable
                    id: setVariable_1fk7Vh
                    displayName: Extract Numbers from phone number
                    variable: Topic.phoneNumber
                    value: =Concat(Split(Topic.phoneNumber,""), If(IsNumeric(Value), Value, ""))

                  - kind: ConditionGroup
                    id: conditionGroup_EkbyNA
                    conditions:
