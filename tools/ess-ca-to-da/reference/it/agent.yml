    displayName: Workday System ParseError
    id: 448a5638-998d-541f-b023-62783476584a
    parentBotId: 00000000-0000-0000-0000-000000000000
    shareContext: {}
    state: Inactive
    status: Inactive
    schemaName: gptagent_copilotforemployeeselfserviceit.topic.WorkdayOnError
    dialog:
      beginDialog:
        kind: OnRedirect
        id: main
        actions:
          - kind: ConditionGroup
            id: conditionGroup_userDataUnavailable
            conditions:
              - id: conditionItem_userDataUnavailable
                condition: =Topic.workdayResponse = "userDataNotAvailable"
                displayName: User data was not available
                actions:
                  - kind: SendActivity
                    id: sendActivity_userDataUnavailable
                    activity: We couldn’t retrieve your employee record from Workday. Start a new conversation and try again. If the problem continues, your Workday account may not be set up or the Workday connector may need attention. Contact your administrator.

                  - kind: CancelAllDialogs
                    id: cancelDialogs_userDataUnavailable

          - kind: BeginDialog
            id: logWorkdayError
            displayName: Log Workday error
            input:
              binding:
                EventName: WorkdayExecutionFailure
                Message: =If(IsBlank(Topic.errorResponse), Topic.workdayResponse, Topic.errorResponse)

            dialog: gptagent_copilotforemployeeselfserviceit.topic.System-Logger

          - kind: ParseValue
            id: parseWorkdayError
            displayName: Parse Workday error response
            variable: Topic.parsedErrorResponse
            valueType:
              kind: Record
              properties:
                error:
                  type:
                    kind: Record
                    properties:
                      message: String

                message: String
                source: String
                status: Number

            value: =If(IsBlank(Topic.errorResponse), "{}", Topic.errorResponse)

          - kind: SetVariable
            id: setParsedWorkdayErrorMessage
            displayName: Select Workday error message
            variable: Topic.parsedErrorMessage
            value: =If(IsBlankOrError(Topic.parsedErrorResponse.error.message), "", Topic.parsedErrorResponse.error.message)

          - kind: ConditionGroup
            id: conditionGroup_specificWorkdayError
            conditions:
              - id: conditionItem_specificWorkdayError
                condition: =!IsBlank(Topic.parsedErrorMessage) && Topic.parsedErrorMessage <> ""
                displayName: Workday returned a specific message
                actions:
                  - kind: BeginDialog
                    id: showSpecificWorkdayError
                    input:
                      binding:
                        varErrorCode: =If(IsBlankOrError(Topic.parsedErrorResponse.status), "400", Topic.parsedErrorResponse.status)
                        varErrorMessage: =Topic.parsedErrorMessage

                    dialog: gptagent_copilotforemployeeselfserviceit.topic.OnError

            elseActions:
              - kind: BeginDialog
                id: showGenericWorkdayError
                input:
                  binding:
                    varErrorCode: "400"
                    varErrorMessage: Sorry, something went wrong while processing your Workday request. Please start a new conversation and try again.

                dialog: gptagent_copilotforemployeeselfserviceit.topic.OnError

      inputType:
        properties:
          errorResponse:
            displayName: errorResponse
            type:
              kind: String
              sensitivityLevel: Sensitive

          workdayResponse:
            displayName: workdayResponse
            type:
              kind: String
              sensitivityLevel: Sensitive

