                      type: "Action.Submit",
                      title: "Submit"
                    },
                    {
                      type: "Action.Submit",
                      title: "Cancel",
                      associatedInputs: "none"
                    }
                  ]
                }
            output:
              binding:
                actionSubmitId: Topic.actionSubmitId
                countryCode: Topic.countryCode
                deviceType: Topic.deviceType
                isPrimary: Topic.isPrimary
                phoneNumber: Topic.phoneNumber

