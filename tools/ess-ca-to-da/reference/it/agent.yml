        Use this topic when the user asks about THEIR OWN national ID(s), national identifier, government-issued ID, citizen ID, tax ID number, or country-specific personal
        identifiers stored in Workday — e.g., Social Security Number (SSN), PAN card, Aadhaar, National Insurance (NI) number, NRIC, CPF, RFC, BSN, or similar. Data belongs
        exclusively to the requesting user.

        Valid: "What are my national IDs?", "What is my SSN / PAN / Aadhaar / NI number on file?", "Show my government ID number", "What national identifiers does Workday have for
        me?"

        Return only masked identifiers ending in the final four characters. Never expose a complete national identifier.

